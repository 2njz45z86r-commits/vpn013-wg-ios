name: Check iOS connection summary policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify independent Ping target and Auto identity policy
        run: |
          swift --version
          swiftc overlay/VPN013/ConnectionSummary.swift overlay/VPN013/tests/ConnectionSummaryTests.swift -o /tmp/vpn013-connection-summary
          /tmp/vpn013-connection-summary
