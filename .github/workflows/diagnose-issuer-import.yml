name: Validate issuer roster and native iPhone client
on:
  push:
    branches: [ios-settings-native-20261030]
permissions:
  contents: read
jobs:
  models:
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test complete roster with legacy and corrected parsers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/issuer-evidence
          swiftc -parse-as-library -swift-version 5 diagnostics/issuer-before.swift diagnostics/IssuerRosterTests.swift -o /tmp/vpn013-legacy-roster
          /tmp/vpn013-legacy-roster diagnostics/issuer-fixtures.json --legacy-unfiltered | tee build/issuer-evidence/legacy-before.txt
          /tmp/vpn013-legacy-roster diagnostics/issuer-fixtures.json --legacy-filtered | tee build/issuer-evidence/legacy-filtered.txt
          swiftc -parse-as-library -swift-version 5 overlay/VPN013/ProxyProfile.swift diagnostics/IssuerRosterTests.swift -o /tmp/vpn013-new-roster
          /tmp/vpn013-new-roster diagnostics/issuer-fixtures.json --current-unfiltered | tee build/issuer-evidence/current-unfiltered.txt
          swiftc -parse-as-library -swift-version 5 overlay/VPN013/ProxyProfile.swift tests/ProxyIssuerCompatibilityTests.swift -o /tmp/vpn013-alias
          /tmp/vpn013-alias | tee build/issuer-evidence/alias.txt
          swiftc -parse-as-library -swift-version 5 overlay/VPN013/ProxyProfile.swift overlay/VPN013/ProxyRouting.swift tests/ProxyProfileTests.swift -o /tmp/vpn013-profiles
          /tmp/vpn013-profiles | tee build/issuer-evidence/profile.txt
          shasum -a 256 overlay/VPN013/ProxyProfile.swift tests/ProxyIssuerCompatibilityTests.swift diagnostics/issuer-fixtures.json > build/issuer-evidence/source-sha256.txt
      - name: Parse changed UIKit sources and validate host models
        run: |
          set -eu
          swiftc -frontend -parse overlay/VPN013/UnifiedClientUI.swift overlay/VPN013/ProxyImportUI.swift overlay/Sources/WireGuardApp/UI/iOS/ViewController/SettingsTableViewController.swift overlay/VPN013/UITests.swift
          sh scripts/check_proxy_models.sh
      - name: Compile native iPhone app without publishing
        run: |
          set -eu
          sh build-on-mac.sh
          (
          if [ -d "$PWD/build/toolchain/go/bin" ]; then export PATH="$PWD/build/toolchain/go/bin:$PATH"; fi
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1 GOFLAGS=-mod=readonly
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CGO_CFLAGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path) -arch arm64 -miphoneos-version-min=14.0"
          export CGO_LDFLAGS="$CGO_CFLAGS"
          python3 scripts/check_go_security.py build/awg/Sources/WireGuardKitGo
          )
      - name: Run actual iPhone simulator scenarios including global settings and retained import text
        env:
          VPN013_IPHONE_ONLY: '1'
        run: sh inspect-on-mac.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-issuer-roster-${{ github.run_id }}
          path: |
            build/issuer-evidence/
            build/review/*.json
            build/review/*.png
            build/review/flow/**/*.png
          if-no-files-found: error
          retention-days: 7
