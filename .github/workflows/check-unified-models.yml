name: Check unified Swift models without provider requests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run bounded models, HTTP stubs and real encrypted storage
        run: sh scripts/check_proxy_models.sh
