name: Diagnose AWG 3.1 race behavior without publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpn013-awg31-race-diagnostic
  cancel-in-progress: false
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify source and stage isolated primary core
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','ab91da252f2ca364e327cc5c4cf88154452dc0dc','HEAD'],text=True).splitlines()
          assert sorted(changed)==['.github/workflows/diagnose-awg31-race.yml','diagnostics/awg31_header_race_test.go']
          PY
          git init -q "$RUNNER_TEMP/apple"
          git -C "$RUNNER_TEMP/apple" remote add origin https://github.com/amnezia-vpn/amneziawg-apple.git
          git -C "$RUNNER_TEMP/apple" fetch -q --depth=1 origin 9d5ee60edefa95b933a738dd7cda671dd18021fc
          git -C "$RUNNER_TEMP/apple" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/apple" rev-parse HEAD)" = 9d5ee60edefa95b933a738dd7cda671dd18021fc
          mkdir -p "$RUNNER_TEMP/module" "$RUNNER_TEMP/output"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.mod" "$RUNNER_TEMP/module/go.mod"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.sum" "$RUNNER_TEMP/module/go.sum"
          cp "$RUNNER_TEMP/module/go.mod" "$RUNNER_TEMP/output/proxy-tun.mod"
          cp "$RUNNER_TEMP/module/go.sum" "$RUNNER_TEMP/output/proxy-tun.sum"
          (cd "$RUNNER_TEMP/module" && go mod download github.com/amnezia-vpn/amneziawg-go/v3)
          python3 - <<'PY'
          import importlib.util,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);spec=importlib.util.spec_from_file_location('prepare',Path('scripts/prepare_primary_awg.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          result=module.prepare_primary_awg(root/'module',root/'output',root/'output/proxy-tun.mod')
          assert result['effectiveReplacementVerified'] and result['moduleCacheUnchanged']
          PY
          cp diagnostics/awg31_header_race_test.go "$RUNNER_TEMP/output/awg-core-owned/device/vpn013_header_race_test.go"
      - name: Run actual race detector on synthetic devices
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          export AWG_FIXTURES="$GITHUB_WORKSPACE/scripts/awg31-fixtures"
          cd "$RUNNER_TEMP/output/awg-core-owned"
          go test -race -json ./device -run '^(TestConcurrencySafety|TestVPN013AuthenticatedFallbackLocalTraffic|TestVPN013AuthenticatedControlFallback|TestVPN013QueuedCandidateRejectsForgedTraffic|TestVPN013HeaderProtectionConcurrentUpdates)$' -count=3 -timeout=120s > "$RUNNER_TEMP/awg31-race.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(x) for x in (Path(os.environ['RUNNER_TEMP'])/'awg31-race.jsonl').read_text().splitlines() if x.startswith('{')]
          names={'TestConcurrencySafety','TestVPN013AuthenticatedFallbackLocalTraffic','TestVPN013AuthenticatedControlFallback','TestVPN013QueuedCandidateRejectsForgedTraffic','TestVPN013HeaderProtectionConcurrentUpdates'}
          counts={n:sum(r.get('Action')=='pass' and r.get('Test')==n for r in rows) for n in names}
          assert all(v==3 for v in counts.values()) and not any(r.get('Action') in ('fail','skip') for r in rows)
          Path(os.environ['GITHUB_WORKSPACE'],'awg31-race-summary.json').write_text(json.dumps({'candidate':'ab91da252f2ca364e327cc5c4cf88154452dc0dc','counts':counts,'scope':'Linux synthetic loopback; not iPhone; no production server'},indent=2))
          print('Synthetic race detector: five named tests passed three times each')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: awg31-race-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: awg31-race-summary.json
          if-no-files-found: error
