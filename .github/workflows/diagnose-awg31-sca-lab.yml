name: AWG lab module vulnerability check
on:
  push:
    branches: [codex/ios-awg31-burst72-sca-20261104]
permissions:
  contents: read
jobs:
  sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare exact lab source and verify host controls
        run: |
          set -euo pipefail
          (cd overlay/Sources/WireGuardKitGo && GOTOOLCHAIN=local go mod download)
          mkdir -p build/lab
          cp overlay/Sources/WireGuardKitGo/go.mod build/lab/lab.mod
          cp overlay/Sources/WireGuardKitGo/go.sum build/lab/lab.sum
          GOTOOLCHAIN=local python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from prepare_primary_awg import prepare_primary_awg
          prepare_primary_awg(Path('overlay/Sources/WireGuardKitGo'),Path('build/lab'),Path('build/lab/lab.mod'))
          PY
      - name: Install pinned official vulnerability scanner
        run: GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan module dependencies against current Go database
        id: scan
        working-directory: build/lab/awg-core-owned
        run: |
          set -uo pipefail
          "$HOME/go/bin/govulncheck" -scan=module -format=json > "$GITHUB_WORKSPACE/build/lab/sca.jsonl" 2> "$GITHUB_WORKSPACE/build/lab/sca-error.txt"
          result=$?
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/build/lab/sca-exit.txt"
          exit "$result"
      - name: Retain scanner output on success or finding
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vpn013-awg31-burst72-sca-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/lab/sca.jsonl
            build/lab/sca-error.txt
            build/lab/sca-exit.txt
