name: Audit disposable iPhone archive for limited secret markers
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-ipa-secret-audit-20261104]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test scanner with synthetic fixtures
        run: python3 -m unittest scripts.tests.test_audit_ipa_secret_markers -v
      - name: Build disposable app and VPN extension
        run: sh build-on-mac.sh
      - name: Verify archive before bounded scan
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/verify_owner_ipa.py build/VPN013AWG-unsigned.ipa build/review/bundle-verification.json build/review/owner-package.json
      - name: Scan archive without printing sensitive content
        run: python3 scripts/audit_ipa_secret_markers.py build/VPN013AWG-unsigned.ipa build/review/ipa-secret-markers.json
      - name: Retain aggregate report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vpn013-disposable-ipa-secret-audit-${{ github.run_id }}
          path: build/review/ipa-secret-markers.json
          if-no-files-found: warn
          retention-days: 7
