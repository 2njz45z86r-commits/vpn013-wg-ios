name: Inspect R013 Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-overlay/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
concurrency:
  group: r013-android-inspection
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain pinned official source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2njz45z86r-commits/vpn013-wg-ios'
          git clone --filter=blob:none --no-checkout https://github.com/amnezia-vpn/amneziawg-android.git android
          git -C android checkout ff15093bf3856fea0947923474870b86efb682f0
          git -C android submodule update --init --recursive
          test "$(git -C android/tunnel/tools/amneziawg-tools rev-parse HEAD)" = ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          test "$(git -C android/tunnel/tools/elf-cleaner rev-parse HEAD)" = 7efc05090675ec6161b7def862728086a26c3b1f
          cp -a android-overlay/. android/
      - name: Pure policy and archive tests
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          mkdir -p output/core-tests
          javac -encoding UTF-8 -d output/core-tests tunnel/src/main/java/org/amnezia/awg/r013/AutoPolicy.java ui/src/main/java/org/amnezia/awg/r013/ArchiveReader.java r013-tests/*.java
          java -cp output/core-tests AutoPolicyTest
          java -cp output/core-tests ArchiveReaderTest
          (cd tunnel/tools/libwg-go && GOTOOLCHAIN=go1.25.14 go test -race -count=1 ./r013probe/... && GOTOOLCHAIN=go1.25.14 go vet ./r013probe/...)
      - name: Compile native Android app sources
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :ui:compileDebugKotlin :ui:compileDebugJavaWithJavac :ui:compileDebugAndroidTestKotlin
      - name: Build native debug and unsigned release APKs
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          ./gradlew --no-daemon --console=plain :ui:assembleDebug :ui:assembleDebugAndroidTest :ui:assembleRelease
      - name: Exercise real VPN and native Material UI in emulator
        id: emulator
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          bash r013-ci/emulator-check.sh
      - name: Export reviewable source and build evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/output/review
          find android/ui/build -name '*.xml' -path '*androidTest-results*' -exec cp {} android/output/review/ \; 2>/dev/null || true
          (cd android/output && zip -qr android-review.zip review)
          if [ '${{ steps.emulator.outcome }}' = success ]; then
            cp android/ui/build/outputs/apk/release/ui-release-unsigned.apk android/output/VPN013WG-Android-unsigned.apk
            (cd android && tar --exclude='./.git' --exclude='*/.git' --exclude='./.gradle' --exclude='*/.cxx' --exclude='*/build' --exclude='./output' --exclude='./local.properties' -czf ../VPN013WG-Android-source.tar.gz .)
            sha256sum android/output/VPN013WG-Android-unsigned.apk VPN013WG-Android-source.tar.gz android/output/android-review.zip > android/output/SHA256SUMS-Android.txt
            gh release create "android-inspection-${GITHUB_RUN_ID}" android/output/VPN013WG-Android-unsigned.apk VPN013WG-Android-source.tar.gz android/output/android-review.zip android/output/SHA256SUMS-Android.txt --target "$GITHUB_SHA" --prerelease --title 'Android native inspection' --notes 'Unsigned Android candidate and official-source overlay. No customer credentials. Review emulator evidence before signing or installing. Physical Android testing remains separate.'
          else
            gh release create "android-inspection-${GITHUB_RUN_ID}" android/output/android-review.zip --target "$GITHUB_SHA" --prerelease --title 'Android inspection diagnostics' --notes 'Build or emulator diagnostics. No ready APK.'
          fi
