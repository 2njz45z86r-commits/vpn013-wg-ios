name: Russian IP routing policy
on:
  push:
    paths:
      - 'windows/overlay/r013routing/**'
      - 'routing/**'
      - '.github/workflows/check-russian-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Exact immutable policy and complement property checks
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/routing"
          cp windows/overlay/r013routing/* "$RUNNER_TEMP/routing/"
          cmp routing/ru-networks.cidr "$RUNNER_TEMP/routing/networks.cidr"
          cmp routing/ru-networks.cidr android-overlay/tunnel/src/main/assets/ru-networks.cidr
          cd "$RUNNER_TEMP/routing"
          printf 'module routingcheck\n\ngo 1.26.0\n' > go.mod
          go test -race -count=1 -v .
          go vet .
