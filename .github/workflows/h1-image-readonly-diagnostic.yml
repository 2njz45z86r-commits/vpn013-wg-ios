name: Inspect H1 WireGuard runtime in a disposable runner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/h1-image-readonly-diagnostic.yml'
      - '.github/workflows/wg-dynamic-diagnostic.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect public image identity and binaries without launching the service
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/h1cloudltd/3x-ui-ptero:3.9.0-h2'
          docker pull "$image"
          docker image inspect "$image" --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}} architecture={{.Architecture}} entrypoint={{json .Config.Entrypoint}}'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/sh "$image" -c '
            set -eu
            for x in /usr/local/x-ui/x-ui /app/x-ui /usr/local/x-ui/bin/xray-linux-amd64 /app/bin/xray-linux-amd64; do
              if [ -x "$x" ]; then
                printf "candidate=%s sha256=" "$x"; sha256sum "$x" | cut -d" " -f1
                case "$x" in *xray*) "$x" version | head -n 2 ;; esac
              fi
            done
          '
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/cat "$image" /usr/local/bin/ptero-entrypoint.sh
  synthetic-dynamic-inbound:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify official Xray 26.6.27 and test loopback-only dynamic inbound
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/XTLS/Xray-core/releases/download/v26.6.27/Xray-linux-64.zip'
          curl --fail --location --silent --show-error --retry 2 "$url" -o "$RUNNER_TEMP/xray.zip"
          echo 'b3e5902d06d6282fe53cfa2fc426058b9aeaa429b2c812e20887cd47f26d08bf  '"$RUNNER_TEMP/xray.zip" | sha256sum --check
          unzip -p "$RUNNER_TEMP/xray.zip" xray > "$RUNNER_TEMP/xray"
          chmod 500 "$RUNNER_TEMP/xray"
          "$RUNNER_TEMP/xray" version | head -n 2
          python3 .github/workflows/wg-dynamic-diagnostic.py "$RUNNER_TEMP/xray"
