name: Check experimental inactive probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/inactive-probe/**'
      - '.github/workflows/check-inactive-probe.yml'
permissions:
  contents: read
concurrency:
  group: vpn013-experimental-probe
  cancel-in-progress: false
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: go1.25.14
      CGO_ENABLED: '1'
    defaults:
      run:
        working-directory: experiments/inactive-probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify pinned dependencies
        run: |
          go version
          go mod verify
      - name: Race-check disposable authenticated probes and transitions
        run: go test -race -count=1 -timeout=90s -v ./...
      - name: Static checks
        run: go vet ./...
      - name: Type-check physical and tunneled UDP APIs against iOS SDK
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios14.0 platform/AppleUDPAPICheck.swift
      - name: Build experimental native callback archive
        if: runner.os == 'macOS'
        run: |
          go build -tags=r013_bridge_test -buildmode=c-archive -o "$RUNNER_TEMP/r013-probe.a" ./applebridge
      - name: Check physical driver against the iOS SDK
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios14.0 -import-objc-header applebridge/bridge.h platform/PhysicalUDPDriver.swift
      - name: Exercise Swift C Go callback ownership and close acknowledgement
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -import-objc-header applebridge/bridge.h -Xcc -DR013_BRIDGE_TESTING platform/PhysicalUDPDriver.swift platform/BridgeNativeCheck.swift "$RUNNER_TEMP/r013-probe.a" -framework NetworkExtension -framework Foundation -lresolv -o "$RUNNER_TEMP/r013-bridge-check"
          "$RUNNER_TEMP/r013-bridge-check"
