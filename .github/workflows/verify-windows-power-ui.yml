name: Verify native Windows156 power control display
on:
  push:
    paths:
      - 'windows/power156-ui/**'
      - '.github/workflows/verify-windows-power-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-review:
    uses: ./.github/workflows/security-review.yml
  native-ui:
    needs: security-review
    runs-on: windows-2025
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture actual native window after all control checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B windows/power156-ui/verify.py
      - name: Preserve native UI proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-power156-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/power156-ui-proof
          if-no-files-found: error
