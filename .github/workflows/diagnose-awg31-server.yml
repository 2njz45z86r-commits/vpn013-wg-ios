name: AWG 3.1 reference server race diagnostic
on:
  push:
    branches: [codex/awg31-server-lab-race-20261104]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare pinned disposable server and original client
        run: python3 scripts/awg31-server-diagnostic/prepare.py
      - name: Check control authentication and malformed frames under race detector
        working-directory: build/awg31-server-diagnostic/server
        env:
          AWG_FIXTURES: ${{ github.workspace }}/scripts/awg31-fixtures
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local go test -race ./device -run '^TestVPN013(AuthenticatedControlFallback|AuthenticatedTransportFallback|ClassifierMalformedFramesDoNotPanic|QueuedCandidateRejectsForgedTraffic)$' -count=1 -timeout=90s -v > "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/security-raw.txt" 2>&1 || { grep -E '^--- FAIL:|^FAIL|^# ' "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/security-raw.txt" || true; exit 1; }
          grep -E '^--- PASS: TestVPN013|^PASS$' "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/security-raw.txt" | tee "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/security-summary.txt"
          for name in AuthenticatedControlFallback AuthenticatedTransportFallback ClassifierMalformedFramesDoNotPanic QueuedCandidateRejectsForgedTraffic; do grep -F -- "--- PASS: TestVPN013${name} " "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/security-summary.txt"; done
      - name: Check original client with patched reference server under race detector
        working-directory: build/awg31-server-diagnostic/case
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local go mod tidy
          GOTOOLCHAIN=local go test -race -run '^TestLabPatchedServerWithOriginalClient$' -count=3 -timeout=90s -v > "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/network-raw.txt" 2>&1 || { grep -E '^--- FAIL:|^FAIL|^# ' "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/network-raw.txt" || true; exit 1; }
          grep -E '^--- PASS: TestLabPatchedServerWithOriginalClient|^PASS$' "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/network-raw.txt" | tee "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/network-summary.txt"
          test "$(grep -c '^--- PASS: TestLabPatchedServerWithOriginalClient ' "$GITHUB_WORKSPACE/build/awg31-server-diagnostic/network-summary.txt")" -eq 3
      - name: Retain synthetic summaries and source hashes only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vpn013-awg31-server-lab-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/awg31-server-diagnostic/security-summary.txt
            build/awg31-server-diagnostic/network-summary.txt
            scripts/awg31-server-diagnostic/manifest.json
