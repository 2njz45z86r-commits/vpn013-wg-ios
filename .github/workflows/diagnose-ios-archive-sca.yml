name: iOS Go archive vulnerability diagnostic
on:
  push:
    branches: [codex/ios-archive-symbol-sca-20261104]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare pinned source-owned iOS dependencies
        run: GOTOOLCHAIN=local python3 scripts/prepare_proxy_tun.py overlay/Sources/WireGuardKitGo build/security-proxy
      - name: Install pinned official vulnerability scanner
        run: GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan actual iOS Go bridge symbols
        id: scan
        working-directory: overlay/Sources/WireGuardKitGo
        run: |
          set -uo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos -f clang)"
          export CGO_CFLAGS="-isysroot $sdk -arch arm64 -miphoneos-version-min=15.0"
          export CGO_LDFLAGS="-isysroot $sdk -arch arm64 -miphoneos-version-min=15.0"
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1 GOTOOLCHAIN=local
          export GOFLAGS="-mod=readonly -modfile=$GITHUB_WORKSPACE/build/security-proxy/proxy-tun.mod"
          "$HOME/go/bin/govulncheck" -scan=symbol -format=json . > "$GITHUB_WORKSPACE/build/security-proxy/sca.jsonl" 2> "$GITHUB_WORKSPACE/build/security-proxy/sca-error.txt"
          result=$?
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/build/security-proxy/sca-exit.txt"
          exit "$result"
      - name: Retain scanner evidence
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vpn013-ios-archive-symbol-sca-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/security-proxy/sca.jsonl
            build/security-proxy/sca-error.txt
            build/security-proxy/sca-exit.txt
            build/security-proxy/proxy-tun-provenance.json
