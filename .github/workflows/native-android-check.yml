name: Compile Android development source without publication
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare pinned upstream and owned overlays
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2njz45z86r-commits/vpn013-wg-ios'
          git clone --filter=blob:none --no-checkout https://github.com/amnezia-vpn/amneziawg-android.git android
          git -C android checkout ff15093bf3856fea0947923474870b86efb682f0
          git -C android submodule update --init --recursive
          test "$(git -C android/tunnel/tools/amneziawg-tools rev-parse HEAD)" = ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          test "$(git -C android/tunnel/tools/elf-cleaner rev-parse HEAD)" = 7efc05090675ec6161b7def862728086a26c3b1f
          cp -a android-overlay/. android/
      - name: Check pause, selection and five-minute schedule
        run: |
          set -euo pipefail
          cd android
          mkdir -p output/models
          javac -encoding UTF-8 -d output/models tunnel/src/main/java/org/amnezia/awg/r013/AutoPolicy.java tunnel/src/main/java/org/amnezia/awg/r013/HourlySchedule.java r013-tests/AutoPolicyTest.java r013-tests/HourlyScheduleTest.java
          java -cp output/models AutoPolicyTest
          java -cp output/models HourlyScheduleTest
          javac -encoding UTF-8 -d output/models ui/src/main/java/org/amnezia/awg/r013/ProxyProfile.java r013-tests/ProxyProfileTest.java
          java -cp output/models ProxyProfileTest
          (cd tunnel/tools/libwg-go && go test -race -mod=readonly ./r013proxy)
      - name: Compile Android backend, UI and instrumented scenarios
        id: compile
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :ui:compileDebugKotlin :ui:compileDebugJavaWithJavac :ui:compileDebugAndroidTestKotlin > ../android-development.log 2>&1 || {
            grep -E '^e:|error:|FAILURE:|Execution failed|^> ' ../android-development.log | head -60 || true
            exit 1
          }
      - name: Record bounded compilation evidence only
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          lines = Path('android-development.log').read_text(errors='replace').splitlines() if Path('android-development.log').exists() else []
          selected = [s for s in lines if s.startswith('e:') or 'error:' in s or 'BUILD SUCCESSFUL' in s or 'BUILD FAILED' in s]
          Path('android-development-review.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'compile':os.environ['COMPILE_OUTCOME'],'errors':selected[-60:],'deviceTestsExecuted':False,'published':False}))
          PY
      - name: Assemble disposable debug APKs and upgrade fixtures
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          (cd android && ./gradlew --no-daemon --console=plain :ui:assembleDebug :ui:assembleDebugAndroidTest > ../android-assembly.log 2>&1) || {
            python3 - <<'PY'
          from pathlib import Path
          rows=Path('android-assembly.log').read_text(errors='replace').splitlines()
          keys=('error:', 'FAILURE:', 'Execution failed', 'go:', '.go:', 'Traceback', 'Error:', 'python3:', 'mktemp:', 'make:', 'No such file', 'link:', 'ld:', 'undefined', 'cannot ', 'failed to ')
          print('\n'.join(s for s in rows if any(k in s for k in keys))[-12000:])
          PY
            exit 1
          }
          bash scripts/build-previous-android-fixture.sh
          bash scripts/build-future-android-fixture.sh
      - name: Exercise disposable VPN, upgrades, native switch and device classes
        id: emulator
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          bash r013-ci/emulator-check.sh
      - name: Inspect reachable native Android dependencies
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1 GOFLAGS=-mod=readonly
          export CC="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          python3 scripts/check_go_security.py android/tunnel/tools/libwg-go --encrypted-report android/output/review/go-findings.enc.json --recipient scripts/audit-recipient.pub
          modfile=$(python3 - <<'PY'
          from pathlib import Path
          import json
          paths=sorted(Path('android/tunnel/build').rglob('proxy-tun.mod'))
          assert 1 <= len(paths) <= 12
          for path in paths:
              proof=json.loads(path.with_name('proxy-tun-provenance.json').read_text())
              assert proof['moduleCacheUnchanged'] and not proof['linkerChecksDisabled'] and proof['anetVersion']=='v0.0.5'
          print(paths[0].resolve())
          PY
          )
          export GOFLAGS="-mod=readonly -modfile=$modfile"
          python3 scripts/check_go_security.py android/tunnel/tools/libwg-go --encrypted-report android/output/review/go-patched-findings.enc.json --recipient scripts/audit-recipient.pub
      - name: Retain credential-free review only
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          base=Path('android/output/review')
          base.mkdir(parents=True,exist_ok=True)
          for path in list(base.rglob('*')):
              if path.is_file() and path.suffix not in ('.png','.json','.xml'):
                  text=path.read_text(errors='replace')
                  selected=[s for s in text.splitlines() if s.startswith('OK (') or 'FAILURES' in s or 'test=' in s or 'INSTRUMENTATION_FAILED' in s or 'AssertionError' in s or 'Process crashed' in s or s.startswith('apkBytes=') or 'R013InstrumentedTest.kt:' in s or s.startswith('INSTRUMENTATION_STATUS_CODE:')]
                  # Only retain exception class and owned test line; no messages,
                  # input URLs, fixture credentials or network endpoint details.
                  for line in text.splitlines():
                      exception=re.search(r'\b(?:java|javax|kotlin|android)[\w.$]*(?:Exception|Error)\b', line)
                      location=re.search(r'R013ProxyRuntimeTest\.kt:\d+', line)
                      if exception: selected.append('exception-class: '+exception.group(0))
                      if location: selected.append('test-location: '+location.group(0))
                  path.with_suffix(path.suffix+'.summary.json').write_text(json.dumps(selected[-80:]))
          (base/'development-summary.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'emulatorOutcome':os.environ['EMULATOR_OUTCOME'],'physicalDeviceVerified':False,'published':False}))
          PY
          (cd android/output && zip -qr android-development-review.zip review -i '*.png' '*.json' '*.xml')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-development-${{ github.run_id }}
          retention-days: 7
          path: |
            android-development-review.json
            android/output/android-development-review.zip
