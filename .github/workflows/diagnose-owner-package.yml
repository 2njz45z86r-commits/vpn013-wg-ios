name: Diagnose owner IPA packaging without retaining the IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-owner-package.yml'
      - 'scripts/verify_owner_ipa.py'
      - 'scripts/verify_owner_codesign.py'
      - 'scripts/tests/test_verify_owner_ipa.py'
      - 'scripts/tests/test_verify_owner_codesign.py'

permissions:
  contents: read

concurrency:
  group: vpn013-owner-package-diagnostic-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify packaging rejection tests
        run: python3 -m unittest scripts.tests.test_verify_owner_ipa scripts.tests.test_verify_owner_codesign -v
      - name: Compile app and extension without publication
        run: sh build-on-mac.sh
      - name: Check disposable archive and both ad-hoc entitlement declarations
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/verify_owner_ipa.py build/VPN013AWG-unsigned.ipa build/review/bundle-verification.json build/review/owner-package.json
          mkdir -p build/owner-package-check
          ditto -x -k build/VPN013AWG-unsigned.ipa build/owner-package-check
          python3 scripts/verify_owner_codesign.py build/owner-package-check/Payload/AmneziaWG.app
      - name: Retain diagnostic metadata only, never the IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vpn013-owner-package-diagnostic-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: build/review/owner-package.json
