name: Upstream core binary security diagnostic
on:
  push:
    branches: [wg-netcheck-20261030]
permissions:
  contents: read
jobs:
  binary-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned official vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Inspect pinned public binaries without starting them
        run: python3 network-diagnostics/core_security_diagnostic.py
      - name: Preserve diagnostic statuses only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-core-security-statuses
          path: core-security-results/*.json
          if-no-files-found: ignore
          retention-days: 2
