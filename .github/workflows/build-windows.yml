name: Build and verify Windows VPN013 WG
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish only after final artifact review
        type: boolean
        default: false
  push:
    paths:
      - "windows/overlay/**"
      - "windows/prepare-ci-source.py"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: write
concurrency:
  group: windows-1.5.4
  cancel-in-progress: false
jobs:
  security-review:
    uses: ./.github/workflows/security-review.yml
  windows:
    needs: [security-review]
    if: github.repository == '2njz45z86r-commits/vpn013-wg-ios'
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact reviewed corresponding source
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'windows-source.zip'
          curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 180 --output $archive 'https://github.com/2njz45z86r-commits/vpn013-wg-ios/releases/download/windows-source-1.4.0/VPN013WG-1.4.0-windows-source.zip'
          if ($LASTEXITCODE -ne 0) {throw 'Source download failed'}
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne 'f7c4a928eecc6e40a1d7b0bcf37bf26d7b6de1b449a2ca26f7cf1ffc2bd83e35') {throw 'Source hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Apply public overlays and preserve exact corresponding source
        run: python windows/prepare-ci-source.py
      - name: Prepare hash-pinned official dependencies
        working-directory: vpn013-wg-windows
        run: |
          python scripts/bootstrap.py
          if ($LASTEXITCODE -ne 0) {throw 'Toolchain preparation failed'}
          ./scripts/bootstrap-driver.ps1
          ./scripts/bootstrap-installer.ps1
      - name: Build native application and MSI
        working-directory: vpn013-wg-windows
        run: |
          ./scripts/build-r013.ps1
          ./scripts/build-installer.ps1
      - name: Check pinned Go dependencies without public finding details
        working-directory: vpn013-wg-windows
        run: |
          $env:PATH=(Join-Path $PWD '.deps/go/bin')+';'+(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          $env:GOFLAGS='-mod=vendor'
          python "$env:GITHUB_WORKSPACE/scripts/check_go_security.py" "$PWD" --level symbol
          if ($LASTEXITCODE -ne 0) {throw 'Private Go dependency review required'}
      - name: Verify actual hourly product and complete native safety inventory
        working-directory: vpn013-wg-windows
        run: |
          $env:GOTOOLCHAIN='local'
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/go/bin')+';'+(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          $env:R013_CI_WINTUN_DLL=Join-Path $PWD 'amd64/wintun.dll'
          $env:R013_CI_CLIENT_EXE=Join-Path $PWD 'amd64/VPN013WG.exe'
          python "$env:GITHUB_WORKSPACE/windows/release-check-hourly.py" "$env:RUNNER_TEMP/hourly-product-report" 'windows'
          if ($LASTEXITCODE -ne 0) {throw 'Actual hourly product acceptance failed'}
      - name: Test protocol, keys, recovery, policy and real ICMP
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          ./.deps/go/bin/go.exe test -mod=vendor -v ./r013 ./manager
          if ($LASTEXITCODE -ne 0) {throw 'Core tests failed'}
      - name: Test native current-card scenarios without customer VPN
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          ./scripts/ci-ui.ps1
      - name: Test install, native AWG traffic, repair and uninstall
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          ./scripts/ci-installer.ps1
      - name: Preserve complete native and UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-1.5.4-native-evidence
          path: |
            ${{ runner.temp }}/hourly-product-report
            ${{ runner.temp }}/r013-ui-*.json
          if-no-files-found: error
      - name: Prepare tested Windows build and source
        working-directory: vpn013-wg-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi=Join-Path $PWD 'installer/dist/VPN013WG-1.5.4-amd64.msi'
          $sourceNamed=Join-Path $env:RUNNER_TEMP 'VPN013WG-1.5.4-windows-source.zip'
          $provenance=[ordered]@{app='vpn013-wg';platform='windows';version='1.5.4';build=7;sourceSHA256=(Get-FileHash -LiteralPath $sourceNamed -Algorithm SHA256).Hash.ToLower();msiSHA256=(Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLower();exeSHA256=(Get-FileHash -LiteralPath 'amd64/VPN013WG.exe' -Algorithm SHA256).Hash.ToLower();runId=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;nativeHandshakeAndICMP=$true;installerPreservedData=$true;nativeCurrentCardScenarios=3;nativeUpdateOfferScenario=$true;inPlaceUpgradeFrom153=$true;autoPinnedFirst=$true;currentPing=$true;hourlyInactiveVPNComparison=$true;actualHourlyTests=112;nativeThreeDayTrial=$true;nativeTrialDurationSeconds=259200;actualHourlyFirstDelaySeconds=30;actualHourlyIntervalSeconds=3600}
          $provenance | ConvertTo-Json | Set-Content -LiteralPath 'installer/dist/windows-build-provenance.json' -Encoding utf8
          $notes=@'
          VPN013 Windows x64 1.5.4.

          Verified on a disposable Windows runner: native MSI install/repair/uninstall; preservation of existing and stock-app data; a real native Wintun tunnel with an obfuscated AmneziaWG handshake and in-tunnel ICMP response against an ephemeral memory-only peer. Protocol, scoped roster updates, key preservation, rollback, release signatures, Auto policy and IPv4/IPv6 ICMP tests passed.

          Auto is pinned first. A separate current-connection card follows the active session independently of row selection, measures its endpoint, uses manual stored-endpoint fallback when runtime statistics are unavailable, refuses an unknown Auto seed and clears stale results. Three native UI fixtures verify these cases with real loopback ICMP; no customer VPN is started by the UI fixtures.

          Registered Russian IPv4/IPv6 destination networks bypass the VPN; other original VPN destinations remain tunneled. The same release-pinned RIPE NCC RU dataset is embedded in iPhone/Android/Windows. Saved keys and profiles are retained. Native controlled routing and narrow WFP admission fixtures must pass; publisher signing remains absent.

          Import, manual profiles, Auto (1–30 full-IPv4 profiles), visible endpoint Ping, native three-day full-ZIP trial import and personal same-key renewal after manual purchase approval, developer contact, order-bound refresh and signed app updates are included. Auto now measures inactive VPN candidates without stopping the primary during Scan: first comparison after30seconds, then3600seconds after completion. Current and candidates use the same authenticated DNS challenge/target/warmup/median3 with current before+after baselines,90seconds total including preparation,6seconds per candidate and partial rotation. Choices use a concrete observed routing/SCM lifecycle guard and exact immutable member revisions; the service owns health and hourly work, with read-only manager supervision. A selected backend change retains the same Wintun but may lose packets during that change. Native disposable compiled-service tests verify primary traffic during candidate Scan, faster-peer selection, real working-seed persistence, rollback and stop cancellation. WAN/owner-PC/hardware sleep-wake are not claimed. DNS latency is not a universal proof of every internet service.

          Independent R013 client, not an official Amnezia/WireGuard release. Application/MSI publisher signature is absent; Wintun retains its original valid vendor signature. Corresponding source and original license texts are attached/included. No customer keys or configurations are present.
          '@
          $notes | Set-Content -LiteralPath 'installer/dist/release-notes.md' -Encoding utf8
      - name: Retain checked installer and corresponding source for final review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verified-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            vpn013-wg-windows/installer/dist/VPN013WG-1.5.4-amd64.msi
            vpn013-wg-windows/installer/dist/windows-build-provenance.json
            vpn013-wg-windows/installer/dist/release-notes.md
            ${{ runner.temp }}/VPN013WG-1.5.4-windows-source.zip
      - name: Publish checked Windows installer only when explicitly requested
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        working-directory: vpn013-wg-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi=Join-Path $PWD 'installer/dist/VPN013WG-1.5.4-amd64.msi'
          $sourceNamed=Join-Path $env:RUNNER_TEMP 'VPN013WG-1.5.4-windows-source.zip'
          gh release create windows-1.5.4 $msi $sourceNamed 'installer/dist/windows-build-provenance.json' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'VPN013 Windows 1.5.4' --notes-file 'installer/dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) {throw 'Release publication failed'}
