name: Build and verify Windows VPN013 WG
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish only after final artifact review
        type: boolean
        default: false
  push:
    paths:
      - "windows/overlay/**"
      - "windows/prepare-ci-source.py"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: write
concurrency:
  group: windows-1.5.7
  cancel-in-progress: false
jobs:
  security-review:
    uses: ./.github/workflows/security-review.yml
  windows:
    needs: [security-review]
    if: github.repository == '2njz45z86r-commits/vpn013-wg-ios'
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact reviewed corresponding source
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'windows-source.zip'
          curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 180 --output $archive 'https://github.com/2njz45z86r-commits/vpn013-wg-ios/releases/download/windows-source-1.4.0/VPN013WG-1.4.0-windows-source.zip'
          if ($LASTEXITCODE -ne 0) {throw 'Source download failed'}
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne 'f7c4a928eecc6e40a1d7b0bcf37bf26d7b6de1b449a2ca26f7cf1ffc2bd83e35') {throw 'Source hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Apply public overlays and preserve exact corresponding source
        run: python windows/prepare-ci-source.py
      - name: Prepare hash-pinned official dependencies
        working-directory: vpn013-wg-windows
        run: |
          python scripts/bootstrap.py
          if ($LASTEXITCODE -ne 0) {throw 'Toolchain preparation failed'}
          ./scripts/bootstrap-driver.ps1
          ./scripts/bootstrap-installer.ps1
      - name: Verify patched primary resource rejection on the fenced Windows device
        working-directory: vpn013-wg-windows
        run: |
          ./.deps/go/bin/go.exe test -mod=vendor -count=1 -timeout=90s -run '^TestPrimary' -v github.com/amnezia-vpn/amneziawg-go/v3/device
          if ($LASTEXITCODE -ne 0) {throw 'Fenced primary resource verification failed'}
          ./.deps/go/bin/go.exe test -mod=vendor -tags r013_resource_fixture -count=1 -timeout=60s -v ./r013resource
          if ($LASTEXITCODE -ne 0) {throw 'Actual import resource/privacy verification failed'}
      - name: Verify actual default Data permissions with SYSTEM and LocalService
        working-directory: vpn013-wg-windows
        env:
          R013_DEFAULT_ACL_FIXTURE: '1'
        run: |
          ./.deps/go/bin/go.exe test -mod=vendor -tags r013_acl_fixture -count=1 -timeout=90s -run '^TestDefaultRootDirectoryACLHostedFixture$' -v ./r013acl
          if ($LASTEXITCODE -ne 0) {throw 'Actual default-directory ACL fixture failed'}
          $aclProof=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'r013-default-acl-proof.json') -Raw | ConvertFrom-Json
          if ($aclProof.sourceCommit -ne $env:GITHUB_SHA -or $aclProof.runId -ne $env:GITHUB_RUN_ID -or $aclProof.fixture -ne 'default-root-directory-acl') {throw 'ACL proof source/run mismatch'}
          if ($aclProof.systemSID -ne 'S-1-5-18' -or $aclProof.localServiceSID -ne 'S-1-5-19') {throw 'ACL proof identity mismatch'}
          if ($aclProof.systemDPAPIRoundTrip -ne $true -or $aclProof.administratorDirectoryReadWrite -ne $true -or $aclProof.localServiceReadWriteDenied -ne $true -or $aclProof.humanStandardUserTested -ne $false -or $aclProof.customerDataUsed -ne $false) {throw 'ACL proof is incomplete or inaccurate'}
      - name: Build native application and MSI
        working-directory: vpn013-wg-windows
        run: |
          ./scripts/build-r013.ps1
          ./scripts/build-installer.ps1
      - name: Check pinned Go dependencies without public finding details
        working-directory: vpn013-wg-windows
        run: |
          $env:PATH=(Join-Path $PWD '.deps/go/bin')+';'+(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          $env:GOFLAGS='-mod=vendor'
          $report=Join-Path $env:RUNNER_TEMP 'windows-go-findings.enc.json'
          $recipient=Join-Path $env:GITHUB_WORKSPACE 'scripts/audit-recipient.pub'
          $provenancePath=Join-Path $env:RUNNER_TEMP 'windows-go-provenance.json'
          $scanInfo=[ordered]@{schema=1;sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;scanLevel='symbol';goVersion=(& go version);goModSHA256=(Get-FileHash -LiteralPath 'go.mod' -Algorithm SHA256).Hash.ToLower();goSumSHA256=(Get-FileHash -LiteralPath 'go.sum' -Algorithm SHA256).Hash.ToLower();recipientSHA256=(Get-FileHash -LiteralPath $recipient -Algorithm SHA256).Hash.ToLower();all34ControlsApproved=$false;status='started'}
          $scanInfo | ConvertTo-Json | Set-Content -LiteralPath $provenancePath -Encoding utf8
          $scanOutput=@(& python "$env:GITHUB_WORKSPACE/scripts/check_go_security.py" "$PWD" --level symbol --encrypted-report $report --recipient $recipient)
          $scanExit=$LASTEXITCODE
          if (Test-Path -LiteralPath $report) {$scanInfo['encryptedReportSHA256']=(Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLower()}
          $scanInfo['status']=if ($scanExit -eq 0) {'pass'} else {'blocked'}
          if ($scanExit -eq 0) {
            $summary=($scanOutput -join "`n") | ConvertFrom-Json
            if ($summary.goSecurityScan -ne 'pass' -or $summary.all34ControlsApproved -ne $false -or $null -eq $summary.moduleOnlyRecordsForPrivateReview) {throw 'Invalid private scan summary'}
            $scanInfo['moduleOnlyRecordsForPrivateReview']=[int]$summary.moduleOnlyRecordsForPrivateReview
          }
          $scanInfo | ConvertTo-Json | Set-Content -LiteralPath $provenancePath -Encoding utf8
          if ($scanExit -ne 0 -or !(Test-Path -LiteralPath $report)) {throw 'Private Go dependency review required'}
          $envelope=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($envelope.Version -ne 1 -or [Convert]::FromBase64String($envelope.Ephemeral).Length -ne 32 -or [Convert]::FromBase64String($envelope.Nonce).Length -ne 12 -or [Convert]::FromBase64String($envelope.Ciphertext).Length -lt 16) {throw 'Encrypted dependency report is invalid'}
          Write-Output ("Go dependency scan completed; {0} module-only records require private review." -f $scanInfo['moduleOnlyRecordsForPrivateReview'])
      - name: Prepare exact inert owner catalog for mandatory no-skip tests
        run: |
          $catalog=Join-Path $env:RUNNER_TEMP 'pinned-service-catalog'
          New-Item -ItemType Directory -Force -Path $catalog | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/overlay/VPN013/ServiceCatalogUI.json" -Destination "$catalog/catalog-ui.json"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/overlay/VPN013/ServiceCatalogRules.json" -Destination "$catalog/catalog-rules.private.json"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/overlay/VPN013/ServiceCatalogGroups.json" -Destination "$catalog/catalog-groups.json"
          foreach ($item in @(@('catalog-ui.json','4fbaf9d8985c50b47465034165180393e11546c396027e5ded57e7c53f5475a3'),@('catalog-rules.private.json','f69a0c79f3077981dca0600657b49a4a085610f76ef407a5f5e0d4874083476b'),@('catalog-groups.json','a88d52da61ab4e596bb6050843bf11619148de40235a00a8162c660aba1ab882'))) {
            if ((Get-FileHash -LiteralPath (Join-Path $catalog $item[0]) -Algorithm SHA256).Hash.ToLower() -ne $item[1]) {throw 'Pinned owner catalog mismatch'}
          }
          "VPN013_ROUTING_CATALOG_TEST_DIR=$catalog" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify actual hourly product and complete native safety inventory
        working-directory: vpn013-wg-windows
        run: |
          $env:GOTOOLCHAIN='local'
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/go/bin')+';'+(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          $env:R013_CI_WINTUN_DLL=Join-Path $PWD 'amd64/wintun.dll'
          $env:R013_CI_CLIENT_EXE=Join-Path $PWD 'amd64/VPN013WG.exe'
          python "$env:GITHUB_WORKSPACE/windows/release-check-hourly.py" "$env:RUNNER_TEMP/hourly-product-report" 'windows' 'service-routing-139'
          if ($LASTEXITCODE -ne 0) {throw 'Actual hourly product acceptance failed'}
      - name: Test protocol, keys, recovery, policy and real ICMP
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          ./.deps/go/bin/go.exe test -mod=vendor -v ./r013 ./manager
          if ($LASTEXITCODE -ne 0) {throw 'Core tests failed'}
      - name: Execute adaptive rate and actual owner catalog checks
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $catalog=Join-Path $env:RUNNER_TEMP 'pinned-service-catalog'
          New-Item -ItemType Directory -Force -Path $catalog | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/overlay/VPN013/ServiceCatalogUI.json" -Destination "$catalog/catalog-ui.json"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/overlay/VPN013/ServiceCatalogRules.json" -Destination "$catalog/catalog-rules.private.json"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/overlay/VPN013/ServiceCatalogGroups.json" -Destination "$catalog/catalog-groups.json"
          $env:VPN013_ROUTING_CATALOG_TEST_DIR=$catalog
          ./.deps/go/bin/go.exe test -mod=vendor -v ./r013traffic ./r013routing
          if ($LASTEXITCODE -ne 0) {throw 'Traffic and catalog model checks failed'}
      - name: Test native current-card scenarios without customer VPN
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          ./scripts/ci-ui.ps1
      - name: Test install, native AWG traffic, repair and uninstall
        working-directory: vpn013-wg-windows
        run: |
          $env:GOPATH=Join-Path $PWD '.deps/gopath'
          $env:PATH=(Join-Path $PWD '.deps/llvm-mingw-20231128-ucrt-x86_64/bin')+';'+$env:PATH
          $env:CGO_ENABLED='1'
          $env:CC='x86_64-w64-mingw32-gcc'
          ./scripts/ci-installer.ps1
      - name: Preserve complete native and UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-1.5.7-native-evidence
          path: |
            ${{ runner.temp }}/hourly-product-report
            ${{ runner.temp }}/r013-ui-*.json
            ${{ runner.temp }}/r013-power-*.png
            ${{ runner.temp }}/r013-traffic-*.png
            ${{ runner.temp }}/r013-services.png
            ${{ runner.temp }}/r013-in-place-upgrade.json
            ${{ runner.temp }}/windows-go-findings.enc.json
            ${{ runner.temp }}/windows-go-provenance.json
            ${{ runner.temp }}/r013-default-acl-proof.json
          if-no-files-found: error
      - name: Prepare tested Windows build and source
        working-directory: vpn013-wg-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi=Join-Path $PWD 'installer/dist/VPN013WG-1.5.7-amd64.msi'
          $sourceNamed=Join-Path $env:RUNNER_TEMP 'VPN013WG-1.5.7-windows-source.zip'
          $native=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hourly-product-report/verification.json') -Raw | ConvertFrom-Json
          if ($native.top_level -ne 139 -or $native.fail -ne 0 -or $native.skip -ne 0) {throw 'Incomplete native service-routing inventory'}
          $upgrade=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'r013-in-place-upgrade.json') -Raw | ConvertFrom-Json
          if ($upgrade.from -ne '1.5.6' -or $upgrade.to -ne '1.5.7' -or $upgrade.oldMSISHA256 -ne '4b3e1e94ad2c2df1fd441a5857693a6b1eefb4cd5cc808e8da606b1eb3d1d68c' -or !$upgrade.sameUpgradeCode -or !$upgrade.singleInstalledProduct -or !$upgrade.withoutUninstall -or !$upgrade.existingDataBytesPreserved -or !$upgrade.syntheticDPAPIDecrypts) {throw 'In-place 1.5.6 upgrade evidence incomplete'}
          $scenarios=@('manual-no-stats','auto','auto-no-stats','update-offer','power','traffic','services')
          foreach ($scenario in $scenarios) {
            $ui=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP ("r013-ui-"+$scenario+".json")) -Raw | ConvertFrom-Json
            if (!$ui.passed -or $ui.scenario -ne $scenario) {throw 'Native UI evidence incomplete'}
          }
          foreach ($capture in @('r013-traffic-adaptive.png','r013-services.png')) {
            if (!(Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP $capture))) {throw 'Required native UI capture missing'}
          }
          $goEvidence=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-go-provenance.json') -Raw | ConvertFrom-Json
          $encryptedReport=Join-Path $env:RUNNER_TEMP 'windows-go-findings.enc.json'
          if ($goEvidence.sourceCommit -ne $env:GITHUB_SHA -or $goEvidence.runId -ne $env:GITHUB_RUN_ID -or $goEvidence.status -ne 'pass' -or $goEvidence.all34ControlsApproved -ne $false -or $goEvidence.goModSHA256 -ne (Get-FileHash -LiteralPath 'go.mod' -Algorithm SHA256).Hash.ToLower() -or $goEvidence.goSumSHA256 -ne (Get-FileHash -LiteralPath 'go.sum' -Algorithm SHA256).Hash.ToLower() -or $goEvidence.encryptedReportSHA256 -ne (Get-FileHash -LiteralPath $encryptedReport -Algorithm SHA256).Hash.ToLower()) {throw 'Go dependency evidence differs from tested source'}
          $provenance=[ordered]@{app='vpn013-wg';platform='windows';version='1.5.7';build=10;sourceSHA256=(Get-FileHash -LiteralPath $sourceNamed -Algorithm SHA256).Hash.ToLower();msiSHA256=(Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLower();exeSHA256=(Get-FileHash -LiteralPath 'amd64/VPN013WG.exe' -Algorithm SHA256).Hash.ToLower();runId=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;nativeHandshakeAndICMP=$true;installerPreservedData=$true;nativeUIScenarios=$scenarios.Count;serviceChooserChecks=8;adaptiveTrafficChecks=8;nativePowerButtonChecks=10;nativeUpdateOfferScenario=$true;inPlaceUpgradeFrom='1.5.6';upgradeSourceMSISHA256=$upgrade.oldMSISHA256;serviceWFPOnlyBypassAndCleanup=$true;nativeTopLevelTests=$native.top_level;nativeSubtests=$native.subtests;nativeTestFailures=$native.fail;nativeTestSkips=$native.skip;goModSHA256=$goEvidence.goModSHA256;goSumSHA256=$goEvidence.goSumSHA256;goModuleOnlyRecordsForPrivateReview=$goEvidence.moduleOnlyRecordsForPrivateReview;hourlyInactiveVPNComparison=$true;actualHourlyFirstDelaySeconds=30;actualHourlyIntervalSeconds=3600}
          $provenance | ConvertTo-Json | Set-Content -LiteralPath 'installer/dist/windows-build-provenance.json' -Encoding utf8
          $notes=@'
          VPN013 Windows x64 1.5.7 (build 10).

          The disposable Windows runner tests an in-place upgrade from the exact released 1.5.6 MSI, preservation of existing data and synthetic protected data, native AWG traffic, repair and uninstall. The service-routing inventory requires all 139 top-level tests with no failures or skips, including actual WFP ONLY/BYPASS and cleanup. Seven native UI scenarios include the service chooser and adaptive traffic display; captures are retained for review.

          Service routing supports the owner catalog for eligible full-IPv4 WireGuard profiles. Only-selected and bypass-selected modes are mutually exclusive and off by default; original profile keys and configuration remain unchanged. IPv6 retains its existing policy. Domain-only catalog entries cannot be applied by this WireGuard engine, and an oversized selection is rejected before applying changes.

          Auto candidates retain the logical Auto profile's service policy, with source-revision and candidate checks. The controlled fixture exercises candidate scanning and a switch on the same Wintun interface; it does not establish owner-device or public-WAN behavior. A backend change can interrupt packets.

          This independent R013 client is not an official Amnezia or WireGuard release. The application and MSI have no publisher signature; the original Wintun driver retains its vendor signature. Corresponding source and license texts are included. No customer keys or configurations are included.
          '@
          $notes | Set-Content -LiteralPath 'installer/dist/release-notes.md' -Encoding utf8
      - name: Retain checked installer and corresponding source for final review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verified-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            vpn013-wg-windows/installer/dist/VPN013WG-1.5.7-amd64.msi
            vpn013-wg-windows/installer/dist/windows-build-provenance.json
            vpn013-wg-windows/installer/dist/release-notes.md
            ${{ runner.temp }}/VPN013WG-1.5.7-windows-source.zip
      - name: Publish checked Windows installer only when explicitly requested
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        working-directory: vpn013-wg-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi=Join-Path $PWD 'installer/dist/VPN013WG-1.5.7-amd64.msi'
          $sourceNamed=Join-Path $env:RUNNER_TEMP 'VPN013WG-1.5.7-windows-source.zip'
          gh release create windows-1.5.7 $msi $sourceNamed 'installer/dist/windows-build-provenance.json' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'VPN013 Windows 1.5.7' --notes-file 'installer/dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) {throw 'Release publication failed'}
