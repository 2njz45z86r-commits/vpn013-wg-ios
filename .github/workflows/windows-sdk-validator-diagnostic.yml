name: Diagnose pinned Windows SDK validator
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-sdk-validator-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check validator bootstrap and report SDK payload identity
        shell: powershell
        run: |
          try {
            & ./windows/overlay/scripts/bootstrap-msi-validator.ps1
          } finally {
            $dir = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.26100.0\x86'
            $names = @('MsiVal2-x86_en-us.msi', '8e4755178e6b5bcba8d3538c3630b7a5.cab', 'b80b7321357f7c9f281536f9440dfe68.cab', 'c2aabf6ea5c1d348ec22f3aeb92f8656.cab')
            foreach ($name in $names) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                $signature = Get-AuthenticodeSignature -LiteralPath $path
                $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
                $subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { 'none' }
                Write-Output ("SDK payload {0} SHA256={1} signature={2} signer={3}" -f $name, $hash, $signature.Status, $subject)
                if ($name -eq 'MsiVal2-x86_en-us.msi') {
                  try {
                    $stage = 'create installer'
                    $installer = New-Object -ComObject WindowsInstaller.Installer
                    $stage = 'open database'
                    $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($path,0))
                    $stage = 'open view'
                    $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@('SELECT * FROM `Property`'))
                    $stage = 'execute view'
                    $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null) | Out-Null
                    $stage = 'fetch record'
                    while ($record = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)) {
                      $stage = 'read property'
                      $key = $record.GetType().InvokeMember('StringData','GetProperty',$null,$record,@(1))
                      if ($key -in @('ProductVersion','Manufacturer','ProductName')) {
                        $value = $record.GetType().InvokeMember('StringData','GetProperty',$null,$record,@(2))
                        Write-Output ("SDK MSI metadata {0}={1}" -f $key, $value)
                      }
                      $stage = 'fetch record'
                    }
                  } catch {
                    Write-Output ("SDK MSI metadata unavailable at {0}: {1}" -f $stage, $_.Exception.Message)
                    $vbs = @(
                      'Set installer = CreateObject("WindowsInstaller.Installer")',
                      'Set db = installer.OpenDatabase(WScript.Arguments.Item(0), 0)',
                      'Set view = db.OpenView("SELECT * FROM `Property`")',
                      'view.Execute',
                      'Do',
                      ' Set record = view.Fetch',
                      ' If record Is Nothing Then Exit Do',
                      ' name = record.StringData(1)',
                      ' If name = "ProductName" Or name = "ProductVersion" Or name = "Manufacturer" Then WScript.Echo "SDK MSI metadata " & name & "=" & record.StringData(2)',
                      'Loop'
                    )
                    $script = Join-Path $env:RUNNER_TEMP 'vpn013-sdk-metadata.vbs'
                    Set-Content -LiteralPath $script -Value $vbs -Encoding ASCII
                    & cscript.exe //nologo $script $path
                    if ($LASTEXITCODE -ne 0) { Write-Output "SDK MSI VBScript metadata exit $LASTEXITCODE" }
                  }
                }
              } else { Write-Output ("SDK payload {0} absent" -f $name) }
            }
            $root = Join-Path ${env:ProgramFiles(x86)} 'MsiVal2'
            if (Test-Path -LiteralPath $root -PathType Container) {
              $files = @(Get-ChildItem -LiteralPath $root -Filter 'evalcom2.dll' -File -Recurse -ErrorAction Stop)
              foreach ($file in $files) {
                $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
                Write-Output ("SDK Evalcom2 file={0} SHA256={1} signature={2}" -f $file.FullName, (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash, $sig.Status)
              }
              if ($files.Count -eq 0) { Write-Output 'SDK Evalcom2 file absent from installed package directory' }
            }
            $clsid = '{6E5E1910-8053-4660-B795-6B612E29BC58}'
            foreach ($view in @([Microsoft.Win32.RegistryView]::Registry32, [Microsoft.Win32.RegistryView]::Registry64)) {
              $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::ClassesRoot, $view)
              try {
                $key = $base.OpenSubKey("CLSID\$clsid\InprocServer32")
                try { $target = if ($key) { $key.GetValue('') } else { $null }; Write-Output ("SDK Evalcom2 registry view={0} target={1}" -f $view, $target) }
                finally { if ($key) { $key.Dispose() } }
              } finally { $base.Dispose() }
            }
          }
      - name: Diagnose signed SDK Evalcom registration on disposable runner
        shell: powershell
        run: |
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:GITHUB_REPOSITORY -cne '2njz45z86r-commits/vpn013-wg-ios') { throw 'Disposable hosted runner required' }
          $dll = Join-Path ${env:ProgramFiles(x86)} 'MsiVal2\evalcom2.dll'
          $reg = Join-Path $env:SystemRoot 'SysWOW64\regsvr32.exe'
          foreach ($file in @($dll,$reg)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Expected SDK component absent' }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch '(?i)(^|,\s*)O=Microsoft Corporation(,|$)') { throw 'Microsoft component signature invalid' }
          }
          if ((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash -cne '028B9DFD55A7BC110EE68C4DBCA4C55644A5204B2BF705EF9CDCF29F88400D15') { throw 'Unexpected SDK Evalcom2 bytes' }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($bytes,60)
          if ($pe -lt 64 -or $pe + 6 -gt $bytes.Length -or [BitConverter]::ToUInt32($bytes,$pe) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x14c) { throw 'SDK Evalcom2 is not the expected 32-bit PE image' }
          $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::ClassesRoot,[Microsoft.Win32.RegistryView]::Registry32)
            $keyPath = 'CLSID\{DC550E10-DBA5-11D1-A850-006097ABDE17}\InprocServer32'
          try {
            $existing = $base.OpenSubKey($keyPath)
            try { $target = if ($existing) { $existing.GetValue('') } else { $null } }
            finally { if ($existing) { $existing.Dispose() } }
            if ($target -and $target -ine $dll) { throw 'Existing 32-bit Evalcom registration points elsewhere' }
            if (!$target) {
              $proc = Start-Process -FilePath $reg -ArgumentList @('/s',('"' + $dll + '"')) -WindowStyle Hidden -PassThru
              if (!$proc.WaitForExit(30000)) { throw 'SDK Evalcom registration timed out' }
              if ($proc.ExitCode -ne 0) { throw "SDK Evalcom registration failed: $($proc.ExitCode)" }
            }
            $registered = $base.OpenSubKey($keyPath)
            try { if (!$registered -or $registered.GetValue('') -ine $dll) { throw 'SDK Evalcom registration did not point to the verified component' } }
            finally { if ($registered) { $registered.Dispose() } }
          } finally { $base.Dispose() }
          Write-Output 'PASS: verified Microsoft SDK 32-bit Evalcom automation component registered on disposable runner'
          $docClass = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::ClassesRoot,[Microsoft.Win32.RegistryView]::Registry32)
          try {
            $docKey = $docClass.OpenSubKey('CLSID\{6E5E1910-8053-4660-B795-6B612E29BC58}\InprocServer32')
            try { Write-Output ("SDK documented C++ CLSID target={0}" -f $(if ($docKey) { $docKey.GetValue('') } else { '<absent>' })) }
            finally { if ($docKey) { $docKey.Dispose() } }
          } finally { $docClass.Dispose() }
          $validator = Join-Path ${env:ProgramFiles(x86)} 'MsiVal2\Msival2.exe'
          $cub = Join-Path ${env:ProgramFiles(x86)} 'MsiVal2\darice.cub'
          $sdkMsi = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.26100.0\x86\MsiVal2-x86_en-us.msi'
          foreach ($file in @($validator,$cub,$sdkMsi)) { if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'SDK validation fixture missing' } }
          & $validator $sdkMsi $cub
          $validatorExit = $LASTEXITCODE
          Write-Output ("SDK fixture ICE validation exit={0}" -f $validatorExit)
          if ($validatorExit -ne 0) { throw 'SDK fixture validation did not pass' }
