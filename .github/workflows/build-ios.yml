name: Diagnose synthetic iPhone Auto ping without publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping-diagnostic:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build source-pinned diagnostic app and extension
        id: compile
        run: sh build-on-mac.sh
      - name: Execute the single real UI test with simulator-only event trace
        if: steps.compile.outcome == 'success'
        env:
          VPN013_IPHONE_ONLY: '1'
        run: |
          set -eu
          python3 scripts/make-ping-diagnostic-inspect.py
          sh inspect-ping-only-on-mac.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('build/review/test-summary.json').read_text())
          assert summary.get('result')=='Passed' and summary.get('passedTests')==1
          assert summary.get('failedTests')==0 and summary.get('skippedTests')==0
          log=Path('build/simulator-test.log').read_text(errors='replace')
          assert "testAutoPinnedFirstWithCurrentMemberAndPing]' passed" in log
          PY
      - name: Package diagnostic evidence, never an IPA
        if: always()
        run: |
          mkdir -p build/review
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          log=Path('build/simulator-test.log')
          if log.exists():
              selected=[s for s in log.read_text(errors='replace').splitlines() if 'error:' in s or 'XCTAssert' in s or 'Test Case ' in s or 'TEST FAILED' in s or 'TEST SUCCEEDED' in s]
              Path('build/review/log-summary.json').write_text(json.dumps(selected[-60:]))
          Path('build/review/run-state.json').write_text(json.dumps({'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'scope':'one synthetic UI test, no physical device, no IPA, no release'}))
          with zipfile.ZipFile('build/ping-diagnostic.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('build/review').rglob('*'):
                  if p.is_file() and p.suffix in ('.png','.json'): z.write(p,p.as_posix().removeprefix('build/'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-ping-diagnostic-${{ github.run_id }}
          path: build/ping-diagnostic.zip
          retention-days: 7
          if-no-files-found: error
