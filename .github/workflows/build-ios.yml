name: Precise routing prototype race checks (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Stage source-pinned synthetic-only routing prototype
        env:
          GOTOOLCHAIN: local
          GOMAXPROCS: '4'
        run: |
          set -eu
          git clone --quiet https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/apple"
          git -C "$RUNNER_TEMP/apple" checkout --quiet 9d5ee60edefa95b933a738dd7cda671dd18021fc
          mkdir -p "$RUNNER_TEMP/module" "$RUNNER_TEMP/staged"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.mod" "$RUNNER_TEMP/module/go.mod"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.sum" "$RUNNER_TEMP/module/go.sum"
          cp "$RUNNER_TEMP/module/go.mod" "$RUNNER_TEMP/staged/proxy-tun.mod"
          cp "$RUNNER_TEMP/module/go.sum" "$RUNNER_TEMP/staged/proxy-tun.sum"
          (cd "$RUNNER_TEMP/module" && go mod download github.com/amnezia-vpn/amneziawg-go/v3)
          python3 - <<'PY'
          from pathlib import Path
          import os,sys
          sys.path.insert(0,'scripts')
          from prepare_primary_awg import prepare_primary_awg
          root=Path(os.environ['RUNNER_TEMP'])
          result=prepare_primary_awg(root/'module',root/'staged',root/'staged/proxy-tun.mod')
          assert result['effectiveReplacementVerified'] and len(result['primaryHostTests']['requiredTests']) == 33
          PY
          go mod download -json github.com/amnezia-vpn/amnezia-xray-core@v1.260728.0 > "$RUNNER_TEMP/xray-module.json"
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          data=json.loads((root/'xray-module.json').read_text())
          assert data['Path']=='github.com/amnezia-vpn/amnezia-xray-core' and data['Version']=='v1.260728.0'
          shutil.copytree(data['Dir'],root/'xray',copy_function=shutil.copyfile)
          PY
          python3 scripts/precise-routing-prototype/apply-prototype.py "$RUNNER_TEMP/xray"
          cd "$RUNNER_TEMP/xray"
          go mod edit -replace="github.com/amnezia-vpn/amneziawg-go/v3=$RUNNER_TEMP/staged/awg-core-owned"
          set +e
          go test -mod=mod -race -json ./proxy/wireguard -run '^TestVPN013(AWG|TUN)' -count=3 -timeout=120s > "$RUNNER_TEMP/race.jsonl" 2> "$RUNNER_TEMP/race.stderr"
          result=$?
          set -e
          export VPN013_RACE_EXIT="$result"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          rows=[json.loads(x) for x in (root/'race.jsonl').read_text().splitlines() if x.startswith('{')]
          names={'TestVPN013AWGInvalidValueNotLogged','TestVPN013AWGSemanticFailureClosesTUN','TestVPN013TUNEventsWaitForConfiguration','TestVPN013AWGAllowedOrdered','TestVPN013AWGRejectsInjectionAndUnbounded','TestVPN013AWGTotalBudgetAndEmptyWireGuard','TestVPN013AWGKeepaliveRangeValidation'}
          counts={n:sum(x.get('Action')=='pass' and x.get('Test')==n for x in rows) for n in names}
          bad=[x.get('Test','package') for x in rows if x.get('Action') in ('fail','skip')]
          race=any('DATA RACE' in x.get('Output','') for x in rows)
          files=['proxy/wireguard/client.go','proxy/wireguard/bind.go','proxy/wireguard/vpn013_awg.go','proxy/wireguard/vpn013_gated_tun.go','proxy/wireguard/vpn013_awg_test.go','infra/conf/wireguard.go']
          out={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
               'exit':int(os.environ['VPN013_RACE_EXIT']),'counts':counts,'failedOrSkipped':bad,'raceDetected':race,
               'stagedSHA256':{p:hashlib.sha256((root/'xray'/p).read_bytes()).hexdigest() for p in files},
               'scope':'Isolated Linux synthetic tests; not iOS, real services or release.'}
          Path(os.environ['GITHUB_WORKSPACE'],'precise-routing-race-summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          assert out['exit']==0 and not race and not bad and all(v==3 for v in counts.values())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: precise-routing-race-${{ github.run_id }}
          path: precise-routing-race-summary.json
          if-no-files-found: warn
