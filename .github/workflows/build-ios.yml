name: Local Swift budget diagnostic (not a release)
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  swift-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact candidate source and nonpublishing scope
        run: |
          test '${{ inputs.development_check }}' = true
          test '${{ inputs.publish_release }}' = false
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only','fc8b1c60c7eb64774c7096bd5f89153baa654d47','HEAD'], text=True).splitlines())
          assert changed == {'.github/workflows/build-ios.yml', 'diagnostics/zip-dedup-harness.py'}
          PY
      - name: Compile and run Swift boundary tests
        run: |
          set -eu
          swiftc --version
          swiftc scripts/PrimaryResourceBudget.swift tests/PrimaryResourceBudgetTests.swift -o "$RUNNER_TEMP/primary-resource-tests"
          "$RUNNER_TEMP/primary-resource-tests"
          python3 scripts/tests/make_client_choice_harness.py "$RUNNER_TEMP/client-choice.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/client-choice.swift" -o "$RUNNER_TEMP/client-choice-tests"
          "$RUNNER_TEMP/client-choice-tests"
          python3 diagnostics/zip-dedup-harness.py "$RUNNER_TEMP/zip-dedup.swift"
          swiftc scripts/PrimaryResourceBudget.swift "$RUNNER_TEMP/zip-dedup.swift" -o "$RUNNER_TEMP/zip-dedup-tests"
          "$RUNNER_TEMP/zip-dedup-tests"
