name: Precise routing iPhone compile (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build source-pinned experimental iPhone app and extension
        run: |
          set -eu
          xcodebuild -version
          sh build-on-mac.sh
          test -d build/device/AmneziaWG.app/PlugIns/WireGuardNetworkExtension.appex
          if [ -d "$PWD/build/toolchain/go/bin" ]; then export PATH="$PWD/build/toolchain/go/bin:$PATH"; fi
          export GOTOOLCHAIN=local
          export GOFLAGS="-mod=readonly -modfile=$PWD/build/proxy-fd/proxy-tun.mod"
          cp scripts/precise-bridge-test.go.txt build/awg/Sources/WireGuardKitGo/r013_precise_bridge_test.go
          (cd build/awg/Sources/WireGuardKitGo && go test -tags vpn013_xray -run '^TestVPN013PreciseBridgeJSON$' -count=1 -v .)
          (cd build/awg/Sources/WireGuardKitGo && go build -tags vpn013_xray -buildmode=c-archive -o "$GITHUB_WORKSPACE/build/precise-host.a" .)
          python3 scripts/make-precise-swift-bridge-smoke.py
          swiftc build/precise-swift-bridge-smoke.swift build/precise-host.a -framework Security -framework CoreFoundation -framework SystemConfiguration -lresolv -o build/precise-swift-bridge-smoke
          build/precise-swift-bridge-smoke
          python3 scripts/make-generated-uapi-bridge-smoke.py
          swiftc build/generated-uapi-bridge-smoke.swift build/precise-host.a -framework Security -framework CoreFoundation -framework SystemConfiguration -lresolv -o build/generated-uapi-bridge-smoke
          build/generated-uapi-bridge-smoke
          python3 scripts/make-precise-profile-chain-smoke.py
          swiftc build/precise-profile-chain-smoke.swift build/precise-host.a -framework NetworkExtension -framework Security -framework CoreFoundation -framework SystemConfiguration -lresolv -o build/precise-profile-chain-smoke
          build/precise-profile-chain-smoke
          python3 scripts/make-private-log-smoke.py
          swiftc build/private-log-smoke.swift -o build/private-log-smoke
          build/private-log-smoke
          cp scripts/precise-network-settings-test.swift build/main.swift
          swiftc overlay/VPN013/PreciseNetworkSettings.swift build/main.swift -framework NetworkExtension -o build/precise-settings-host
          build/precise-settings-host
          device=$(xcrun simctl list devices available -j | python3 scripts/select_iphone_simulator.py)
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          simsdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator swiftc -sdk "$simsdk" -target arm64-apple-ios14.0-simulator overlay/VPN013/PreciseNetworkSettings.swift build/main.swift -framework NetworkExtension -o build/precise-settings-simulator
          codesign --force --sign - build/precise-settings-simulator
          xcrun simctl spawn "$device" "$PWD/build/precise-settings-simulator"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('build/proxy-fd/xray-core-owned')
          manifest=json.loads(Path('scripts/precise-routing-prototype/manifest.json').read_bytes())
          for name,expected in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected['prototypeSHA256']
          app=Path('build/device/AmneziaWG.app')
          report={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                  'sourcePinnedFiles':len(manifest['files']),'deviceAppBuilt':app.is_dir(),
                  'extensionBuilt':(app/'PlugIns/WireGuardNetworkExtension.appex').is_dir(),
                  'bridgeJSONHostTested':True,'swiftCGoHostTested':True,'generatedUapiBridgeHostTested':True,'profileChainHostTested':True,'privateAdapterLogHostTested':True,'networkSnapshotHostTested':True,'networkSnapshotSimulatorTested':True,'physicalDeviceTested':False,'signedForDistribution':False,'routingIntegrated':False,
                  'scope':'Compile-only isolated diagnostic; no IPA retained, no device VPN proof, no release.'}
          Path('build/precise-native-compile.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: precise-ios-compile-${{ github.run_id }}
          path: build/precise-native-compile.json
          if-no-files-found: error
          retention-days: 7
