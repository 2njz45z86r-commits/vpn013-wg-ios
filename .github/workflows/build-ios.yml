name: Runtime log behavior diagnostic (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact candidate Swift privacy test
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','8afe0ccf22224d24fcfbaa9b5da62f6adb1bd52a','HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/build-ios.yml']
          PY
          python3 scripts/tests/make_runtime_log_harness.py "$RUNNER_TEMP/runtime-log.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/runtime-log.swift" -o "$RUNNER_TEMP/runtime-log-test"
          "$RUNNER_TEMP/runtime-log-test"
