name: Precise NetworkExtension copy check (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test synthetic settings copy on macOS and iPhone simulator
        run: |
          set -eu
          mkdir -p build
          swiftc scripts/precise-network-settings-copy.swift -framework NetworkExtension -o build/precise-settings-host
          build/precise-settings-host
          device=$(xcrun simctl list devices available -j | python3 scripts/select_iphone_simulator.py)
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          simsdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator swiftc -sdk "$simsdk" -target arm64-apple-ios14.0-simulator scripts/precise-network-settings-copy.swift -framework NetworkExtension -o build/precise-settings-simulator
          codesign --force --sign - build/precise-settings-simulator
          xcrun simctl spawn "$device" "$PWD/build/precise-settings-simulator"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          data={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                'testSourceSHA256':hashlib.sha256(Path('scripts/precise-network-settings-copy.swift').read_bytes()).hexdigest(),
                'hostTested':True,'simulatorTested':True,'systemSettingsApplied':False,'physicalDeviceTested':False,
                'scope':'Synthetic NetworkExtension object copy only; no VPN, no app release.'}
          Path('build/precise-settings-report.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: precise-settings-copy-${{ github.run_id }}
          path: build/precise-settings-report.json
          if-no-files-found: error
          retention-days: 7
