name: Build and inspect VPN013 WG
on:
  workflow_dispatch:
  push:
    paths:
      - 'overlay/**'
permissions:
  contents: write
concurrency:
  group: vpn013-ios-manual
  cancel-in-progress: false
jobs:
  security-review:
    uses: ./.github/workflows/security-review.yml
  build:
    needs: [security-review]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check tools and evidence export compatibility
        run: |
          xcodebuild -version
          swift --version
          xcrun xcresulttool export attachments --help >/dev/null
          xcrun xcresulttool get test-results summary --help >/dev/null
      - name: Test core and build unsigned app
        run: sh build-on-mac.sh
      - name: Check native Go dependencies without public finding details
        run: |
          set -eu
          if [ -d "$PWD/build/toolchain/go/bin" ]; then export PATH="$PWD/build/toolchain/go/bin:$PATH"; fi
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1 GOFLAGS=-mod=readonly
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CGO_CFLAGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path) -arch arm64 -miphoneos-version-min=14.0"
          export CGO_LDFLAGS="$CGO_CFLAGS"
          python3 scripts/check_go_security.py build/awg/Sources/WireGuardKitGo
      - name: Verify native checks and appearances
        id: native
        run: |
          if [ "$(git rev-parse HEAD:overlay)" = "adb8f91595889440912b7a2b3a29de081628b2fa" ]; then
            python3 reuse-verified-native-review.py
          else
            sh inspect-on-mac.sh
          fi
      - name: Preserve build evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p build/review
          (cd build && zip -qr native-review.zip review -i '*.png' '*.json')
          if [ '${{ steps.native.outcome }}' = 'success' ]; then
            test -f build/VPN013AWG-unsigned.ipa
            shasum -a 256 build/VPN013AWG-unsigned.ipa build/native-review.zip > build/SHA256SUMS.txt
            gh release create "unsigned-${GITHUB_RUN_ID}" \
              build/VPN013AWG-unsigned.ipa build/native-review.zip build/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "VPN013 WG unsigned build ${GITHUB_RUN_NUMBER}" \
              --notes 'Unsigned development build. Requires owner signing and physical iPhone VPN verification. No customer configurations or credentials included.'
            python3 publish-client-release.py
          else
            shasum -a 256 build/native-review.zip > build/SHA256SUMS.txt
            gh release create "inspection-${GITHUB_RUN_ID}" \
              build/native-review.zip build/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "VPN013 WG inspection ${GITHUB_RUN_NUMBER}" \
              --notes 'Native simulator diagnostics only. Failed evidence export or test run; no installable app published.'
          fi
      - name: Export credential-free development files for verification
        if: always()
        run: python3 export-build-evidence.py
