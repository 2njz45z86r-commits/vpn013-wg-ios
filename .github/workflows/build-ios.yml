name: iPhone simulator catalog diagnostic (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify diagnostic scope and select a real iPhone simulator
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','d47f50796088613d5e56458ab9d556bd48f2463a','HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/build-ios.yml']
          PY
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'simulators.json')))
          for runtime,devices in d.get('devices',{}).items():
            names=[x.get('name') for x in devices if x.get('name','').startswith('iPhone ')]
            if names: print(runtime, sorted(names))
          PY
          python3 scripts/select_iphone_simulator.py < "$RUNNER_TEMP/simulators.json" > "$RUNNER_TEMP/selected.txt"
          test -s "$RUNNER_TEMP/selected.txt"
