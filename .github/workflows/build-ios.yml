name: Local Swift budget diagnostic (not a release)
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  swift-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact candidate source and nonpublishing scope
        run: |
          test '${{ inputs.development_check }}' = true
          test '${{ inputs.publish_release }}' = false
          test "$(git diff --name-only 60cf75dcd3a9d9d8efce19734c2bbb8bb9536d58 HEAD)" = .github/workflows/build-ios.yml
      - name: Compile and run Swift boundary tests
        run: |
          set -eu
          swiftc --version
          swiftc scripts/PrimaryResourceBudget.swift tests/PrimaryResourceBudgetTests.swift -o "$RUNNER_TEMP/primary-resource-tests"
          "$RUNNER_TEMP/primary-resource-tests"
