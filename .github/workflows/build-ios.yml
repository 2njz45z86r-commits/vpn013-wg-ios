name: Diagnose legacy AWG 1.5 concurrency without publication
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vpn013-awg15-reference-diagnostic
  cancel-in-progress: false
jobs:
  race:
    if: inputs.development_check == true && inputs.publish_release != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check official old engine using the race detector
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/legacy"
          git -C "$RUNNER_TEMP/legacy" remote add origin https://github.com/amnezia-vpn/amneziawg-go.git
          git -C "$RUNNER_TEMP/legacy" fetch -q --depth=1 origin 699bd240cc44d1a106ad3d2591df227c8fa0a8cd
          git -C "$RUNNER_TEMP/legacy" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/legacy" rev-parse HEAD)" = 699bd240cc44d1a106ad3d2591df227c8fa0a8cd
          cp diagnostics/awg15_legacy_race_test.go "$RUNNER_TEMP/legacy/device/awg/vpn013_legacy_race_test.go"
          cd "$RUNNER_TEMP/legacy"
          set +e
          go test -race -json ./device/awg -run '^TestVPN013LegacyConcurrentSpecialPackets$' -count=1 -timeout=60s > "$RUNNER_TEMP/awg15-race.jsonl" 2> "$RUNNER_TEMP/awg15-race.stderr"
          result=$?
          set -e
          export VPN013_TEST_EXIT="$result"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'awg15-race.jsonl').read_text(errors='replace')
          records=[json.loads(s) for s in raw.splitlines() if s.startswith('{')]
          name='TestVPN013LegacyConcurrentSpecialPackets'
          passed=sum(x.get('Action')=='pass' and x.get('Test')==name for x in records)
          failed=sum(x.get('Action')=='fail' and x.get('Test')==name for x in records)
          race=any('DATA RACE' in x.get('Output','') for x in records)
          value={'officialLegacyCommit':'699bd240cc44d1a106ad3d2591df227c8fa0a8cd','test':name,'exit':int(os.environ['VPN013_TEST_EXIT']),'passed':passed,'failed':failed,'raceDetected':race,'scope':'official legacy code, synthetic non-network workload on Linux'}
          Path(os.environ['GITHUB_WORKSPACE'],'awg15-race-summary.json').write_text(json.dumps(value,indent=2))
          print('Synthetic legacy race diagnostic:', 'race detected' if race else 'no race reported')
          PY
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: awg15-race-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: awg15-race-summary.json
          if-no-files-found: error
