name: Diagnose AWG engines without publication
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vpn013-awg31-race-diagnostic
  cancel-in-progress: false
jobs:
  race:
    if: inputs.development_check == true && inputs.publish_release != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify source and stage isolated primary core
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','ab91da252f2ca364e327cc5c4cf88154452dc0dc','HEAD'],text=True).splitlines()
          allowed={'.github/workflows/build-ios.yml','diagnostics/awg31_header_race_test.go'}
          assert set(changed)>=allowed and all(x in allowed or x.startswith('diagnostics/legacy-engine/') for x in changed)
          PY
          git init -q "$RUNNER_TEMP/apple"
          git -C "$RUNNER_TEMP/apple" remote add origin https://github.com/amnezia-vpn/amneziawg-apple.git
          git -C "$RUNNER_TEMP/apple" fetch -q --depth=1 origin 9d5ee60edefa95b933a738dd7cda671dd18021fc
          git -C "$RUNNER_TEMP/apple" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/apple" rev-parse HEAD)" = 9d5ee60edefa95b933a738dd7cda671dd18021fc
          mkdir -p "$RUNNER_TEMP/module" "$RUNNER_TEMP/output"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.mod" "$RUNNER_TEMP/module/go.mod"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.sum" "$RUNNER_TEMP/module/go.sum"
          cp "$RUNNER_TEMP/module/go.mod" "$RUNNER_TEMP/output/proxy-tun.mod"
          cp "$RUNNER_TEMP/module/go.sum" "$RUNNER_TEMP/output/proxy-tun.sum"
          (cd "$RUNNER_TEMP/module" && go mod download github.com/amnezia-vpn/amneziawg-go/v3)
          python3 - <<'PY'
          import importlib.util,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);spec=importlib.util.spec_from_file_location('prepare',Path('scripts/prepare_primary_awg.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          result=module.prepare_primary_awg(root/'module',root/'output',root/'output/proxy-tun.mod')
          assert result['effectiveReplacementVerified'] and result['moduleCacheUnchanged']
          PY
          cp diagnostics/awg31_header_race_test.go "$RUNNER_TEMP/output/awg-core-owned/device/vpn013_header_race_test.go"
      - name: Run actual race detector on synthetic devices
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          export AWG_FIXTURES="$GITHUB_WORKSPACE/scripts/awg31-fixtures"
          cd "$RUNNER_TEMP/output/awg-core-owned"
          go test -race -json ./device -run '^(TestConcurrencySafety|TestVPN013AuthenticatedFallbackLocalTraffic|TestVPN013AuthenticatedControlFallback|TestVPN013QueuedCandidateRejectsForgedTraffic|TestVPN013HeaderProtectionConcurrentUpdates)$' -count=3 -timeout=120s > "$RUNNER_TEMP/awg31-race.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(x) for x in (Path(os.environ['RUNNER_TEMP'])/'awg31-race.jsonl').read_text().splitlines() if x.startswith('{')]
          names={'TestConcurrencySafety','TestVPN013AuthenticatedFallbackLocalTraffic','TestVPN013AuthenticatedControlFallback','TestVPN013QueuedCandidateRejectsForgedTraffic','TestVPN013HeaderProtectionConcurrentUpdates'}
          counts={n:sum(r.get('Action')=='pass' and r.get('Test')==n for r in rows) for n in names}
          assert all(v==3 for v in counts.values()) and not any(r.get('Action') in ('fail','skip') for r in rows)
          Path(os.environ['GITHUB_WORKSPACE'],'awg31-race-summary.json').write_text(json.dumps({'candidate':'ab91da252f2ca364e327cc5c4cf88154452dc0dc','counts':counts,'scope':'Linux synthetic loopback; not iPhone; no production server'},indent=2))
          print('Synthetic race detector: five named tests passed three times each')
          PY
      - name: Apply experimental legacy source and test under race detector
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path('diagnostics/legacy-engine');target=Path(os.environ['RUNNER_TEMP'])/'output/awg-core-owned/device'
          manifest=json.loads((source/'manifest.json').read_text())
          assert set(manifest)=={'device.go','peer.go','send.go','uapi.go','r013_resource_limits.go','r013_legacy15.go','r013_legacy15_test.go','r013_legacy_uapi_test.go'}
          for name,item in manifest.items():
              p=target/name
              if item['beforeSHA256'] is None: assert not p.exists()
              else: assert hashlib.sha256(p.read_bytes()).hexdigest()==item['beforeSHA256']
              data=(source/(name+'.txt')).read_bytes();assert hashlib.sha256(data).hexdigest()==item['afterSHA256'];p.write_bytes(data)
          PY
          export AWG_FIXTURES="$GITHUB_WORKSPACE/scripts/awg31-fixtures"
          cd "$RUNNER_TEMP/output/awg-core-owned"
          set +e
          go test -race -json ./device -run '^(TestLegacy15|TestVPN013Legacy|TestPrimary|TestTwoDevicePing|TestAWGDevicePing|TestVPN013AuthenticatedFallbackLocalTraffic|TestVPN013QueuedCandidateRejectsForgedTraffic)' -count=3 -timeout=120s > "$RUNNER_TEMP/awg15-prototype-race.jsonl" 2> "$RUNNER_TEMP/awg15-prototype-race.stderr"
          result=$?
          set -e
          export VPN013_TEST_EXIT="$result"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'awg15-prototype-race.jsonl').read_text(errors='replace')
          rows=[json.loads(x) for x in raw.splitlines() if x.startswith('{')]
          names={'TestLegacy15PacketSemantics','TestLegacy15ControlledWaitAndOddHex','TestLegacy15Scheduling','TestLegacy15MalformedAndBudgets','TestLegacy15ConfigValidation','TestVPN013LegacyUAPIStagingAndPeerPreservation','TestVPN013LegacyWaitStopsWhenDeviceGoesDown','TestVPN013LegacyConcurrentUpdatesAndGeneration','TestTwoDevicePing','TestAWGDevicePing','TestVPN013AuthenticatedFallbackLocalTraffic','TestVPN013QueuedCandidateRejectsForgedTraffic'}
          counts={n:sum(x.get('Action')=='pass' and x.get('Test')==n for x in rows) for n in names}
          race=any('DATA RACE' in x.get('Output','') for x in rows)
          failures=[x.get('Test','package') for x in rows if x.get('Action') in ('fail','skip')]
          value={'candidateBase':'ab91da252f2ca364e327cc5c4cf88154452dc0dc','counts':counts,'failedOrSkipped':failures,'raceDetected':race,'exit':int(os.environ['VPN013_TEST_EXIT']),'scope':'experimental legacy engine; synthetic Linux loopback, not iPhone or production'}
          Path(os.environ['GITHUB_WORKSPACE'],'awg15-prototype-race-summary.json').write_text(json.dumps(value,indent=2))
          print('Legacy prototype diagnostic:', 'race detected' if race else 'no race reported')
          if value['exit'] or race or failures or any(v!=3 for v in counts.values()): raise SystemExit(1)
          PY
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: awg31-race-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            awg31-race-summary.json
            awg15-prototype-race-summary.json
          if-no-files-found: error
