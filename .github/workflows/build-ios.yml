name: Inspect iOS release URL boundary without publishing
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  swift-url-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify diagnostic scope and run Foundation URL probes
        run: |
          set -eu
          test '${{ inputs.development_check }}' = true
          test '${{ inputs.publish_release }}' = false
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','95815499bcc5ffe9c7a0017a9537366bdc39fe28','HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/build-ios.yml']
          PY
          cat > "$RUNNER_TEMP/url-boundary.swift" <<'SWIFT'
          import Foundation
          let prefix = "/2njz45z86r-commits/vpn013-wg-ios/releases/download/"
          let inputs: [(String,String)] = [
            ("normal","https://github.com/2njz45z86r-commits/vpn013-wg-ios/releases/download/v1/example.ipa"),
            ("dot_segments","https://github.com/2njz45z86r-commits/vpn013-wg-ios/releases/download/../../../../other/repo/example.ipa"),
            ("encoded_dot_segments","https://github.com/2njz45z86r-commits/vpn013-wg-ios/releases/download/%2e%2e/%2e%2e/other/repo/example.ipa")]
          for (name,input) in inputs {
            guard let u = URL(string: input) else { print(name+":invalid"); continue }
            let valid = u.scheme == "https" && u.host == "github.com" && u.user == nil && u.password == nil && (u.port == nil || u.port == 443) && u.query == nil && u.fragment == nil && u.path.hasPrefix(prefix) && u.path.hasSuffix(".ipa")
            let standardized = u.standardized.path.hasPrefix(prefix)
            print(name+":allowed="+String(valid)+",standardizedPathInside="+String(standardized))
          }
          SWIFT
          swiftc "$RUNNER_TEMP/url-boundary.swift" -o "$RUNNER_TEMP/url-boundary"
          "$RUNNER_TEMP/url-boundary"
