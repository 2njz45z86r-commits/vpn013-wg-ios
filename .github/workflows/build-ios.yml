name: Test actual iOS release URL validator without publication
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validator:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile and test the actual source validator
        run: |
          set -eu
          test '${{ inputs.development_check }}' = true
          test '${{ inputs.publish_release }}' = false
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          changed=subprocess.check_output(['git','diff','--name-only','6e6c17a9c965dfecbaedf6755a56bde2f48b3a2c','HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/build-ios.yml']
          src=Path('overlay/VPN013/ClientUpdateProtocol.swift').read_text()
          actual=src[src.index('struct ClientAppRelease: Codable {'):src.index('/// Only bound profile IDs')]
          head='''import Foundation
          enum ClientUpdateError: Error { case invalidResponse }
          enum ClientUpdateProtocol {
            static func validHash(_ value: String) -> Bool { value.range(of: "^[a-f0-9]{64}$", options: .regularExpression) != nil }
          }
          '''
          tests=r'''
          let prefix="https://github.com/2njz45z86r-commits/vpn013-wg-ios/releases/download/"
          let good=["v1/VPN013-1.7.5.ipa","unsigned-test/VPN013AWG-unsigned.ipa","v1.2.3-beta_1/Example_1.ipa"]
          let bad=["../../../../other/repo/example.ipa","%2e%2e/%2e%2e/other/repo/example.ipa","v1%2Fextra/example.ipa","v1/example%2eipa","v1/../example.ipa","v1//example.ipa","/v1/example.ipa","v1/example.ipa/extra.ipa","../example.ipa","v1/../evil.ipa"]
          func accepted(_ suffix: String) -> Bool {
            let v=ClientAppRelease(schema:1,app:"vpn013-wg",platform:"ios",version:"1.7.5",build:1,downloadURL:prefix+suffix,sha256:String(repeating:"a",count:64),notes:"")
            do { try v.validate(); return true } catch { return false }
          }
          for (i,item) in good.enumerated() { guard accepted(item) else { fatalError("valid case \(i) rejected") } }
          for (i,item) in bad.enumerated() { guard !accepted(item) else { fatalError("unsafe case \(i) accepted") } }
          print("Actual ClientAppRelease.validate: 3 valid and 10 unsafe synthetic cases passed")
          '''
          Path(os.environ['RUNNER_TEMP'],'url-validator.swift').write_text(head+actual+tests)
          PY
          swiftc "$RUNNER_TEMP/url-validator.swift" -o "$RUNNER_TEMP/url-validator"
          "$RUNNER_TEMP/url-validator"
