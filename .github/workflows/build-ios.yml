name: UAPI peer preflight race diagnostic (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Stage exact candidate and check races using synthetic traffic
        env:
          GOTOOLCHAIN: local
          GOMAXPROCS: '4'
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','18c4def378bb692cfb3ba67b9e2aa5114278ac52','HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/build-ios.yml']
          PY
          git clone --quiet https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/apple"
          git -C "$RUNNER_TEMP/apple" checkout --quiet 9d5ee60edefa95b933a738dd7cda671dd18021fc
          mkdir -p "$RUNNER_TEMP/module" "$RUNNER_TEMP/staged"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.mod" "$RUNNER_TEMP/module/go.mod"
          cp "$RUNNER_TEMP/apple/Sources/WireGuardKitGo/go.sum" "$RUNNER_TEMP/module/go.sum"
          cp "$RUNNER_TEMP/module/go.mod" "$RUNNER_TEMP/staged/proxy-tun.mod"
          cp "$RUNNER_TEMP/module/go.sum" "$RUNNER_TEMP/staged/proxy-tun.sum"
          (cd "$RUNNER_TEMP/module" && go mod download github.com/amnezia-vpn/amneziawg-go/v3)
          python3 - <<'PY'
          from pathlib import Path
          import os,sys
          sys.path.insert(0,'scripts')
          from prepare_primary_awg import prepare_primary_awg
          root=Path(os.environ['RUNNER_TEMP'])
          result=prepare_primary_awg(root/'module',root/'staged',root/'staged/proxy-tun.mod')
          assert result['effectiveReplacementVerified'] and len(result['primaryHostTests']['requiredTests']) == 33
          print('Exact staged primary core: all 33 required host tests passed')
          PY
          export AWG_FIXTURES="$GITHUB_WORKSPACE/scripts/awg31-fixtures"
          cd "$RUNNER_TEMP/staged/awg-core-owned"
          set +e
          go test -race -json ./device -run '^(TestLegacy15|TestVPN013Legacy|TestVPN013HeaderOverlapRejectedBeforePeerMutation|TestVPN013InvalidPeerFieldsRejectedBeforePeerMutation|TestPrimary|TestTwoDevicePing|TestAWGDevicePing|TestVPN013AuthenticatedFallbackLocalTraffic|TestVPN013QueuedCandidateRejectsForgedTraffic)' -count=3 -timeout=120s > "$RUNNER_TEMP/race.jsonl" 2> "$RUNNER_TEMP/race.stderr"
          result=$?
          set -e
          export VPN013_RACE_EXIT="$result"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          rows=[json.loads(x) for x in (Path(os.environ['RUNNER_TEMP'])/'race.jsonl').read_text().splitlines() if x.startswith('{')]
          names={'TestVPN013InvalidPeerFieldsRejectedBeforePeerMutation','TestVPN013HeaderOverlapRejectedBeforePeerMutation','TestVPN013LegacyStaleSnapshotAfterModeSwitch','TestVPN013LegacyRejectPreparedPacketAfterModeSwitch','TestVPN013LegacySendCompletesBeforeModeCommit','TestVPN013LegacyEndpointRefreshKeepsRevision','TestVPN013LegacyMaskingChangesAdvanceRevision','TestVPN013LegacyConcurrentUpdatesAndGeneration','TestVPN013LegacyWaitStopsWhenDeviceGoesDown','TestVPN013LegacyUAPIStagingAndPeerPreservation','TestVPN013LegacySparsePackets','TestTwoDevicePing','TestAWGDevicePing','TestVPN013AuthenticatedFallbackLocalTraffic','TestVPN013QueuedCandidateRejectsForgedTraffic'}
          counts={n:sum(x.get('Action')=='pass' and x.get('Test')==n for x in rows) for n in names}
          failures=[x.get('Test','package') for x in rows if x.get('Action') in ('fail','skip')]
          race=any('DATA RACE' in x.get('Output','') for x in rows)
          root=Path(os.environ['RUNNER_TEMP'])/'staged/awg-core-owned/device'
          files=['device.go','peer.go','send.go','uapi.go','r013_resource_limits.go','r013_legacy15.go','r013_legacy_uapi_test.go','r013_stale_snapshot_test.go']
          out={'exit':int(os.environ['VPN013_RACE_EXIT']),'counts':counts,'failedOrSkipped':failures,'raceDetected':race,'stagedSHA256':{n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in files},'scope':'synthetic Linux tests; not physical iPhone or production'}
          Path(os.environ['GITHUB_WORKSPACE'],'preflight-race-summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          assert out['exit']==0 and not race and not failures and all(x==3 for x in counts.values())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uapi-peer-preflight-race-${{ github.run_id }}
          path: preflight-race-summary.json
          if-no-files-found: warn
