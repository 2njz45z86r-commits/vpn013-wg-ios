name: Actual iPhone parser diagnostic (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile pinned parser with synthetic model stubs
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','18c4def378bb692cfb3ba67b9e2aa5114278ac52','HEAD'],text=True).splitlines())
          assert changed == {'.github/workflows/build-ios.yml','diagnostics/actual-parser-harness.py'}
          PY
          git clone --quiet https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/apple"
          git -C "$RUNNER_TEMP/apple" checkout --quiet 9d5ee60edefa95b933a738dd7cda671dd18021fc
          python3 diagnostics/actual-parser-harness.py "$RUNNER_TEMP/apple" "$RUNNER_TEMP/parser.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/parser.swift" -o "$RUNNER_TEMP/parser-tests"
          "$RUNNER_TEMP/parser-tests"
