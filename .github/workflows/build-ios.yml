name: Local Swift budget diagnostic (not a release)
on:
  workflow_dispatch:
    inputs:
      development_check:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  swift-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact candidate source and nonpublishing scope
        run: |
          test '${{ inputs.development_check }}' = true
          test '${{ inputs.publish_release }}' = false
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only','fc8b1c60c7eb64774c7096bd5f89153baa654d47','HEAD'], text=True).splitlines())
          allowed = {'.github/workflows/build-ios.yml', 'diagnostics/zip-dedup-harness.py', 'diagnostics/actual-parser-harness.py', 'diagnostics/go-sca-debug.py'}
          assert allowed <= changed and all(x in allowed or x.startswith('diagnostics/revision-engine/') for x in changed)
          PY
      - name: Compile and run Swift boundary tests
        run: |
          set -eu
          swiftc --version
          swiftc scripts/PrimaryResourceBudget.swift tests/PrimaryResourceBudgetTests.swift -o "$RUNNER_TEMP/primary-resource-tests"
          "$RUNNER_TEMP/primary-resource-tests"
          python3 scripts/tests/make_client_choice_harness.py "$RUNNER_TEMP/client-choice.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/client-choice.swift" -o "$RUNNER_TEMP/client-choice-tests"
          "$RUNNER_TEMP/client-choice-tests"
          python3 diagnostics/zip-dedup-harness.py "$RUNNER_TEMP/zip-dedup.swift"
          swiftc scripts/PrimaryResourceBudget.swift "$RUNNER_TEMP/zip-dedup.swift" -o "$RUNNER_TEMP/zip-dedup-tests"
          "$RUNNER_TEMP/zip-dedup-tests"
      - name: Compile the actual pinned parser with synthetic model stubs
        run: |
          set -eu
          git clone --quiet https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/apple"
          git -C "$RUNNER_TEMP/apple" checkout --quiet 9d5ee60edefa95b933a738dd7cda671dd18021fc
          python3 diagnostics/actual-parser-harness.py "$RUNNER_TEMP/apple" "$RUNNER_TEMP/actual-parser.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/actual-parser.swift" -o "$RUNNER_TEMP/actual-parser-tests"
          "$RUNNER_TEMP/actual-parser-tests"
  go-core-scan:
    if: inputs.development_check == true && inputs.publish_release != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Stage and verify the candidate AWG core on Linux
        env:
          GOTOOLCHAIN: local
          GOMAXPROCS: '4'
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','fc8b1c60c7eb64774c7096bd5f89153baa654d47','HEAD'],text=True).splitlines())
          allowed={'.github/workflows/build-ios.yml','diagnostics/zip-dedup-harness.py','diagnostics/actual-parser-harness.py','diagnostics/go-sca-debug.py'}
          assert allowed <= changed and all(x in allowed or x.startswith('diagnostics/revision-engine/') for x in changed)
          PY
          git clone --quiet https://github.com/amnezia-vpn/amneziawg-apple.git "$RUNNER_TEMP/go-apple"
          git -C "$RUNNER_TEMP/go-apple" checkout --quiet 9d5ee60edefa95b933a738dd7cda671dd18021fc
          mkdir -p "$RUNNER_TEMP/module" "$RUNNER_TEMP/staged"
          cp "$RUNNER_TEMP/go-apple/Sources/WireGuardKitGo/go.mod" "$RUNNER_TEMP/module/go.mod"
          cp "$RUNNER_TEMP/go-apple/Sources/WireGuardKitGo/go.sum" "$RUNNER_TEMP/module/go.sum"
          cp "$RUNNER_TEMP/module/go.mod" "$RUNNER_TEMP/staged/proxy-tun.mod"
          cp "$RUNNER_TEMP/module/go.sum" "$RUNNER_TEMP/staged/proxy-tun.sum"
          (cd "$RUNNER_TEMP/module" && go mod download github.com/amnezia-vpn/amneziawg-go/v3)
          python3 - <<'PY'
          from pathlib import Path
          import os,sys
          sys.path.insert(0,'scripts')
          from prepare_primary_awg import prepare_primary_awg
          root=Path(os.environ['RUNNER_TEMP'])
          result=prepare_primary_awg(root/'module',root/'staged',root/'staged/proxy-tun.mod')
          assert result['effectiveReplacementVerified']
          print('Exact staged AWG core: required synthetic host tests passed')
          PY
      - name: Run race detector on isolated legacy revision prototype
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path('diagnostics/revision-engine');target=Path(os.environ['RUNNER_TEMP'])/'staged/awg-core-owned/device'
          manifest=json.loads((source/'manifest.json').read_text())
          assert set(manifest)=={'device.go','peer.go','send.go','uapi.go','r013_resource_limits.go','r013_legacy15.go','r013_legacy_uapi_test.go','r013_stale_snapshot_test.go'}
          for name,item in manifest.items():
              p=target/name
              if item['beforeSHA256'] is None: assert not p.exists()
              else: assert hashlib.sha256(p.read_bytes()).hexdigest()==item['beforeSHA256']
              data=(source/(name+'.txt')).read_bytes();assert hashlib.sha256(data).hexdigest()==item['afterSHA256'];p.write_bytes(data)
          PY
          export AWG_FIXTURES="$GITHUB_WORKSPACE/scripts/awg31-fixtures"
          cd "$RUNNER_TEMP/staged/awg-core-owned"
          set +e
          go test -race -json ./device -run '^(TestLegacy15|TestVPN013Legacy|TestPrimary|TestTwoDevicePing|TestAWGDevicePing|TestVPN013AuthenticatedFallbackLocalTraffic|TestVPN013QueuedCandidateRejectsForgedTraffic)' -count=3 -timeout=120s > "$RUNNER_TEMP/revision-race.jsonl" 2> "$RUNNER_TEMP/revision-race.stderr"
          result=$?
          set -e
          export VPN013_RACE_EXIT="$result"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(x) for x in (Path(os.environ['RUNNER_TEMP'])/'revision-race.jsonl').read_text().splitlines() if x.startswith('{')]
          names={'TestVPN013LegacyStaleSnapshotAfterModeSwitch','TestVPN013LegacyRejectPreparedPacketAfterModeSwitch','TestVPN013LegacySendCompletesBeforeModeCommit','TestVPN013LegacyConcurrentUpdatesAndGeneration','TestVPN013LegacyWaitStopsWhenDeviceGoesDown','TestVPN013LegacyUAPIStagingAndPeerPreservation','TestVPN013LegacySparsePackets','TestTwoDevicePing','TestAWGDevicePing','TestVPN013AuthenticatedFallbackLocalTraffic','TestVPN013QueuedCandidateRejectsForgedTraffic'}
          counts={n:sum(x.get('Action')=='pass' and x.get('Test')==n for x in rows) for n in names}
          failures=[x.get('Test','package') for x in rows if x.get('Action') in ('fail','skip')]
          race=any('DATA RACE' in x.get('Output','') for x in rows)
          result={'exit':int(os.environ['VPN013_RACE_EXIT']),'counts':counts,'failedOrSkipped':failures,'raceDetected':race,'scope':'isolated prototype on synthetic Linux devices; no iPhone or production servers'}
          Path(os.environ['GITHUB_WORKSPACE'],'revision-race-summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          assert result['exit']==0 and not race and not failures and all(x==3 for x in counts.values())
          PY
      - name: Retain synthetic race summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: awg-revision-race-${{ github.run_id }}
          path: revision-race-summary.json
          if-no-files-found: warn
