name: iPhone ARM runner discovery (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate, available simulators, and Swift privacy behavior
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','8afe0ccf22224d24fcfbaa9b5da62f6adb1bd52a','HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/build-ios.yml']
          PY
          xcodebuild -version
          uname -m
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'simulators.json')))
          for runtime,devices in d.get('devices',{}).items():
            names=[x.get('name') for x in devices if x.get('name','').startswith('iPhone ')]
            if names: print(runtime, sorted(names))
          PY
          python3 scripts/select_iphone_simulator.py < "$RUNNER_TEMP/simulators.json" > "$RUNNER_TEMP/selected.txt"
          test -s "$RUNNER_TEMP/selected.txt"
          python3 scripts/tests/make_runtime_log_harness.py "$RUNNER_TEMP/runtime-log.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/runtime-log.swift" -o "$RUNNER_TEMP/runtime-log-test"
          "$RUNNER_TEMP/runtime-log-test"
